  state.saison++; state.journee = 0; state.phase = null;
  state.date = debutSaison(state.saison); state.evenement = null;               // retour à la reprise d'août
  const ids = idsChampionnat(); state.calendrier = genererCalendrier(ids); state.classement = classementVide(ids);
  state.journeeVue = 1; c.budget += 4;                                          // dotation de nouvelle saison
  intersaisonCentreFormation();                                                  // centre de formation : progression, départs, nouvelle promotion
  if(partis.length) actualite(`Fins de contrat : ${partis.join(", ")} quittent le club (fins de contrat non prolongées).`, "erreur");
  actualite(`Saison ${state.saison} : le championnat reprend, budget crédité de 4 M€.`, "ok");
  nettoyerFeuille(); state.feuille = compositionAuto(state.clubId);
  if(!capitaine()) state.capitaine = capitaineAuto();
  state.ecran = "dashboard"; sauvegarder(); render();
}

/* =====================================================================
   6. MARCHÉ DES TRANSFERTS & SALARY CAP
   ===================================================================== */
/** Salaire attendu par un joueur (k€/an) selon niveau, âge et situation. */
function demandeSalariale(p){
  const base = salaireIndicatif(moyenne(p)) * (p.age>=33 ? 0.8 : p.age<=22 ? 0.85 : 1);
  return Math.round(Math.max(base, p.salaire*0.9));
}
/**
 * Indemnité due au club vendeur (M€), calquée sur la réalité :
 *  - dernière année de contrat : le joueur peut partir libre l'été suivant, l'indemnité s'effondre
 *  - contrat long + jeune international : quasi intransférable, l'indemnité explose
 *  - joueur listé : le club veut s'en séparer, forte décote
 */
function indemniteTransfert(p){
  const ans = Math.max(0, p.contrat.anneesRestantes);
  const niv = moyenne(p);
  let val = Math.pow(Math.max(0, niv - 8), 2.1) * 0.022;                 // valeur marchande (M€) : très progressive
  if(p.age <= 23) val *= 1.45; else if(p.age <= 27) val *= 1.15; else if(p.age >= 33) val *= 0.4; else if(p.age >= 30) val *= 0.7;
  if(p.jiff) val *= 1.15;                                                // un JIFF vaut plus cher sur le marché français
  const duree = ans <= 0 ? 0.05 : ans === 1 ? 0.3 : ans === 2 ? 0.85 : 1.5; // dernière année = presque libre
  const dispo = p.listeTransfert ? 0.5 : 1;                              // listé : le club brade
  const rarete = 1 + Math.max(0, niv - 13) * (p.listeTransfert ? 0.18 : 0.45);   // plus il est bon, plus le prix s'envole
  return Math.max(0.02, Math.round(val * duree * dispo * rarete * 100)/100);
}
/** Un joueur en dernière année peut être négocié en pré-contrat : il arrivera libre la saison suivante. */
const preContratPossible = p => p.contrat.anneesRestantes <= 1 && p.clubId && p.clubId !== state.clubId;
/** La fenêtre des pré-contrats s'ouvre à partir de la J11 (fenêtre hivernale) jusqu'à la fin de saison. */
function fenetrePreContrat(){
  if(state.phase) return state.phase.etape !== "terminee";
  return state.journee + 1 >= MERCATO_HIVER[0];
}
const preContratSigne = pid => (state.preContrats||[]).some(x=>x.pid===pid);
/** Applique les pré-contrats à l'intersaison : les joueurs rejoignent le club gratuitement. */
function appliquerPreContrats(){
  const c = club(); const arrivees = [];
  for(const pc of (state.preContrats||[])){
    const p = joueur(pc.pid); if(!p) continue;
    const anc = state.equipes[p.clubId];
    if(!anc || p.clubId===c.id){ continue; }
    if(!p.jiff && nonJiff(c) >= NON_JIFF_MAX){ actualite(`Pré-contrat annulé : ${p.nom} ferait passer l'effectif au-dessus des ${NON_JIFF_MAX} non-JIFF.`, "erreur"); continue; }
    if(masseSalariale(c) + pc.salaire/1000 > SALARY_CAP){ actualite(`Pré-contrat annulé : ${p.nom} ferait dépasser le plafond salarial.`, "erreur"); continue; }
    anc.joueurs = anc.joueurs.filter(x=>x!==p);
    p.clubId = c.id; p.salaire = pc.salaire; p.contrat = {anneesRestantes:pc.duree}; p.listeTransfert = false; c.joueurs.push(p);
    arrivees.push(`${p.nom} (${anc.court})`);
  }
  state.preContrats = [];
  if(arrivees.length) actualite(`Pré-contrats honorés : ${arrivees.join(", ")} arrivent libres.`, "ok");
}
/**
 * Ouverture d'un club vendeur à une approche sur un joueur NON listé (0-100).
 * Plus le joueur est jeune, bon, JIFF et sous contrat long, plus le club refuse.
 */
function ouvertureClubVendeur(p){
  const e = state.equipes[p.clubId]; if(!e) return 0;
  let o = 60 - (moyenne(p) - 12) * 6 - p.contrat.anneesRestantes * 8;
  if(p.age >= 33) o += 20; else if(p.age >= 30) o += 8; else if(p.age <= 22) o -= 10;
  if(p.jiff) o -= 8;
  const memePoste = e.joueurs.filter(x => x.id!==p.id && auPoste(x, p.poste) && moyenne(x) >= moyenne(p) - 1).length;
  o += memePoste * 7;                                                    // doublon au poste : le club lâche plus vite
  if(masseSalariale(e) > SALARY_CAP - 0.3) o += 12;                      // club au plafond : vendeur
  return clamp(Math.round(o), 0, 95);
}
/** Le club accepte-t-il d'ouvrir la discussion ? (tirage unique mémorisé par saison) */
function approcheAcceptee(p){
  p.approches = p.approches || {};
  const cle = "s" + state.saison;
  if(p.approches[cle] === undefined) p.approches[cle] = Math.random()*100 < ouvertureClubVendeur(p);
  return p.approches[cle];
}

function faireOffre(pid, salaire, duree){
  const p = joueur(pid); const c = club();
  if(!p) return {ok:false, texte:"Joueur introuvable."};
  if(p.clubId===c.id) return {ok:false, texte:"Ce joueur est déjà dans votre effectif."};
  if(!p.clubId || !state.equipes[p.clubId]) return {ok:false, texte:"Joueur introuvable."};
  if(!p.listeTransfert) return {ok:false, texte:`${p.nom} est sous contrat et n'est pas sur la liste des transferts.`};
  if(!(salaire>0)) return {ok:false, texte:"Indiquez un salaire annuel en k€."};
  if(c.joueurs.length >= TAILLE_EFFECTIF_MAX) return {ok:false, texte:`Effectif complet (${TAILLE_EFFECTIF_MAX} joueurs maximum).`};
  const masse = masseSalariale(c) + salaire/1000;
  if(masse > SALARY_CAP) return {ok:false, texte:`Transfert refusé par la commission de régulation : masse salariale ${masse.toFixed(2)} M€ au-dessus du plafond de ${SALARY_CAP} M€.`};
  const indem = indemniteTransfert(p);
  if(indem > c.budget) return {ok:false, texte:`Budget insuffisant pour l'indemnité de transfert (${indem.toFixed(2)} M€ demandés, ${c.budget.toFixed(2)} M€ disponibles).`};
  const demande = demandeSalariale(p);
  const repRequise = clamp((moyenne(p)-9)*10, 0, 95);
  const facteur = 1 + Math.max(0, repRequise - c.reputation)/150 + (duree===1 ? 0.08 : duree===3 ? -0.04 : 0);
  if(salaire < Math.round(demande*facteur)) return {ok:false, texte:`${p.nom} refuse : il attend environ ${Math.round(demande*facteur)} k€/an${duree===1?" et préfère un contrat plus long":""}.`};
  const anc = state.equipes[p.clubId]; anc.joueurs = anc.joueurs.filter(x=>x!==p); anc.budget += indem; c.budget -= indem;
  p.clubId = c.id; p.salaire = salaire; p.contrat = {anneesRestantes:duree}; p.listeTransfert = false; c.joueurs.push(p);
  actualite(`Recrue : ${p.nom} (${POSTES[p.poste]}) signe ${duree} an(s) à ${salaire} k€.`, "ok");
  return {ok:true, texte:`${p.nom} signe pour ${duree} an(s) à ${salaire} k€/an (indemnité ${indem.toFixed(2)} M€ versée à ${anc.court}).`};
}
/** Intérêt du joueur pour votre club (0-100) : prestige, classement, temps de jeu, attachement, âge. */
function interetJoueur(p, duree){
  const c = club(); const anc = state.equipes[p.clubId];
  const repAttendue = reputationAttendue(p);                                      // le standing qu'il estime mériter
  let i = 45 + (c.reputation - repAttendue) * 2 + (c.reputation - (anc ? anc.reputation : 70)) * 0.5;
  const rang = classementTrie().findIndex(l=>l.id===c.id); if(rang>=0) i += (7 - rang) * 1.5;
  const meilleur = Math.max(0, ...c.joueurs.filter(x=>auPoste(x, p.poste)).map(moyenne));
  i += moyenne(p) >= meilleur + 1 ? 8 : moyenne(p) >= meilleur ? 5 : moyenne(p) >= meilleur - 1 ? 0 : -12;     // temps de jeu espéré
  i += duree===3 ? 8 : duree===1 ? -8 : 0;
  if(p.age>=32 && duree>=2) i += 6;                                               // un vétéran veut de la sécurité
  if(p.age<=23) i -= 6;                                                           // un jeune en devenir se laisse désirer
  if(p.jiff && anc && anc.ville && c.ville && anc.ville===c.ville) i += 10;
  if(p.listeTransfert) i += 12;                                                   // il sait qu'il doit partir
  if(p.attache===undefined) p.attache = Math.round((((p.id*2654435761)>>>0)%21) - 10);  // trait stable : attachement au club actuel
  i -= p.attache;
  return clamp(Math.round(i), 3, 97);
}
/** Réputation de club qu'un joueur de ce niveau estime mériter. */
function reputationAttendue(p){ return 70 + (moyenne(p) - 12) * 3.5; }
/** Seuil d'intérêt sous lequel le joueur refuse catégoriquement, quel que soit le salaire. */
function seuilExigence(p){ return clamp(Math.round(26 + Math.max(0, moyenne(p) - 13.5) * 9), 22, 80); }
/** Le joueur accepte-t-il seulement de discuter avec votre club ? */
function joueurEcoute(p, duree){ return interetJoueur(p, duree||2) >= seuilExigence(p); }
/** Phrase de refus, pour expliquer au manager ce qui bloque. */
function motifRefus(p){
  const c = club(); const anc = state.equipes[p.clubId];
  const meilleur = Math.max(0, ...c.joueurs.filter(x=>auPoste(x, p.poste)).map(moyenne));
  if(c.reputation < reputationAttendue(p) - 4) return `il vise un club d'un autre standing que ${c.court}`;
  if(anc && anc.reputation > c.reputation + 6) return `il ne voit pas ${c.court} comme une progression par rapport à ${anc.court}`;
  if(moyenne(p) < meilleur - 1) return `il ne se voit pas doublure de vos joueurs à ce poste`;
  if(p.attache > 4) return `il est très attaché à ${anc ? anc.court : "son club"}`;
  return `votre projet sportif ne le convainc pas pour l'instant`;
}
/** Exigences du joueur et du club vendeur à un tour donné (chacun concède un peu à chaque tour). */
function demandesNegociation(p, duree, tour, precontrat){
  const interet = interetJoueur(p, duree);
  const exigence = (precontrat ? 1.3 : 1) * (p.listeTransfert ? 1 : 1.12);   // libre : il se sait courtisé, il monte ses prétentions
  const salaire = Math.round(demandeSalariale(p) * exigence * (1.25 - interet/200) * (1 - (tour-1)*0.04));
  const indemnite = precontrat ? 0 : Math.round(indemniteTransfert(p) * (1 - (tour-1)*0.08) * 100)/100;
  return {interet, salaire, indemnite};
}
/**
 * Concurrence : à l'ouverture d'un dossier, 0 à 3 clubs se positionnent aussi.
 * Chaque tour de négociation leur laisse une chance de conclure avant vous.
 */
function creerDossier(p){
  const c = club();
  const rivaux = Object.values(state.equipes).filter(e => !e.horsChampionnat && e.id!==c.id && e.id!==p.clubId
      && masseSalariale(e) + p.salaire/1000 <= SALARY_CAP && e.joueurs.length < TAILLE_EFFECTIF_MAX
      && (p.jiff || nonJiff(e) < NON_JIFF_MAX) && e.budget >= indemniteTransfert(p))
    .sort((a,b)=>b.reputation-a.reputation);
  const attractif = clamp(Math.round((moyenne(p)-11)*22 + (p.age<=25?15:0) + (p.listeTransfert?10:0)), 0, 95);
  const nb = attractif>70 ? 1+Math.floor(Math.random()*3) : attractif>45 ? Math.floor(Math.random()*3) : Math.floor(Math.random()*2);
  const choisis = rivaux.slice(0, Math.min(6, rivaux.length)).sort(()=>Math.random()-0.5).slice(0, nb);
  return {pid:p.id, rivaux:choisis.map(e=>e.id), ouvert:state.journee};
}
/** Un rival peut rafler la cible entre deux tours. */
function concurrenceJoue(n){
  const d = state.dossiers[n.pid]; if(!d || !d.rivaux.length) return null;
  const p = joueur(n.pid); const c = club();
  const prestigeMoi = c.reputation + (classementTrie().findIndex(l=>l.id===c.id) < 6 ? 6 : 0);
  for(const rid of d.rivaux){
    const e = state.equipes[rid]; if(!e) continue;
    const avantage = clamp((e.reputation - prestigeMoi)/100, -0.25, 0.25);
    if(Math.random() < 0.13 + avantage + (n.tour-1)*0.07){                       // plus on traîne, plus le risque monte
      const indem = indemniteTransfert(p); const anc = state.equipes[p.clubId];
      anc.joueurs = anc.joueurs.filter(x=>x!==p); anc.budget += indem; e.budget -= indem;
      p.clubId = e.id; p.salaire = Math.round(demandeSalariale(p)*1.05); p.contrat = {anneesRestantes:2}; p.listeTransfert = false; e.joueurs.push(p);
      delete state.dossiers[n.pid];
      actualite(`${p.nom} signe à ${e.court} : vous avez été doublé sur ce dossier.`, "erreur");
      return e;
    }
  }
  return null;
}
/** Ouvre une négociation de pré-contrat (indemnité nulle, effet la saison suivante). */
function ouvrirPreContrat(pid){
  const p = joueur(pid); const c = club();
  if(!p || !preContratPossible(p)) return {ok:false, texte:"Ce joueur n'est pas en dernière année de contrat."};
  if(!fenetrePreContrat()) return {ok:false, texte:`Les pré-contrats ne s'ouvrent qu'à partir de la journée ${MERCATO_HIVER[0]}.`};
  if(preContratSigne(pid)) return {ok:false, texte:`${p.nom} a déjà signé un pré-contrat avec vous.`};
  if((state.preContrats||[]).length >= MAX_RECRUES) return {ok:false, texte:`${MAX_RECRUES} pré-contrats déjà signés pour la saison prochaine.`};
  if(p.negoBloquee && p.negoBloquee > state.journee) return {ok:false, texte:`${p.nom} a rompu les discussions, revenez dans ${p.negoBloquee - state.journee} journée(s).`};
  if(!joueurEcoute(p, 3)) return {ok:false, texte:`${p.nom} décline votre approche : ${motifRefus(p)} (intérêt ${interetJoueur(p,3)}/100, seuil ${seuilExigence(p)}).`};
  state.dossiers = state.dossiers || {};
  if(!state.dossiers[pid]) state.dossiers[pid] = creerDossier(p);
  state.negociation = {pid, tour:1, duree:2, historique:[], statut:"en cours", joker:false, sousContrat:false, preContrat:true, mode:"precontrat"};
  return {ok:true, texte:`Pré-contrat : ${p.nom} est libre l'été prochain, aucune indemnité à verser. Il sera très courtisé.`};
}
function ouvrirNegociation(pid){
  const p = joueur(pid); const c = club();
  if(!p || !p.clubId || p.clubId===c.id) return {ok:false, texte:"Joueur introuvable ou déjà chez vous."};
  const fen = mercatoOuvert(); const joker = !fen.ouvert && jokerMedicalPossible();
  if(!p.listeTransfert){
    if(joker) return {ok:false, texte:`Un joker médical ne peut concerner qu'un joueur placé sur la liste des transferts.`};
    if(!approcheAcceptee(p)) return {ok:false, texte:`${state.equipes[p.clubId].court} refuse toute discussion pour ${p.nom} cette saison (ouverture ${ouvertureClubVendeur(p)}/100).`};
  }
  if(!fen.ouvert && !joker) return {ok:false, texte:`Mercato ${fen.libelle}. Hors fenêtre, seul un joker médical (joueur blessé 4 semaines ou plus) est autorisé.`};
  if(!p.jiff && nonJiff(c) >= NON_JIFF_MAX) return {ok:false, texte:`Règle des ${NON_JIFF_MAX} non-JIFF : votre effectif en compte déjà ${nonJiff(c)}, impossible de recruter ${p.nom} (non-JIFF).`};
  if(p.negoBloquee && p.negoBloquee > state.journee) return {ok:false, texte:`${p.nom} a rompu les discussions, revenez dans ${p.negoBloquee - state.journee} journée(s).`};
  if(!joueurEcoute(p, 3)) return {ok:false, texte:`${p.nom} décline : ${motifRefus(p)} (intérêt ${interetJoueur(p,3)}/100, il lui en faudrait ${seuilExigence(p)}).`};
  if(c.joueurs.length >= TAILLE_EFFECTIF_MAX) return {ok:false, texte:`Effectif complet (${TAILLE_EFFECTIF_MAX}).`};
  state.dossiers = state.dossiers || {};
  if(!state.dossiers[pid]) state.dossiers[pid] = creerDossier(p);
  state.negociation = {pid, tour:1, duree: joker ? 1 : 2, historique:[], statut:"en cours", joker, sousContrat: !p.listeTransfert, preContrat: preContratPossible(p)};
  return {ok:true, texte: joker ? `Joker médical : discussions ouvertes avec ${p.nom} (contrat jusqu'à la fin de la saison).`
    : p.listeTransfert ? `Discussions ouvertes avec ${p.nom} et ${state.equipes[p.clubId].court}.`
    : `${state.equipes[p.clubId].court} accepte d'écouter votre offre pour ${p.nom}, mais l'indemnité sera salée.`};
}
function executerTransfert(p, salaire, duree, indem){
  const c = club(); const anc = state.equipes[p.clubId];
  anc.joueurs = anc.joueurs.filter(x=>x!==p); anc.budget += indem; c.budget -= indem;
  state.enveloppe = Math.round((state.enveloppe - indem)*100)/100; state.recruesSaison++;
  delete state.dossiers[p.id];
  p.clubId = c.id; p.salaire = salaire; p.contrat = {anneesRestantes:duree}; p.listeTransfert = false; c.joueurs.push(p);
  actualite(`Recrue : ${p.nom} (${POSTES[p.poste]}) arrive de ${anc.court} pour ${indem.toFixed(2)} M€, ${duree} an(s) à ${salaire} k€.`, "ok");
}
/**
 * Masse salariale tolérée par le président : le minimum entre le plafond LNR moins une marge
 * et ce que le club peut réellement payer (30,5 % de son budget). Les effectifs étant déjà
 * calibrés à ce niveau, recruter impose presque toujours de libérer de la masse d'abord.
 */
const masseCible = () => Math.min(SALARY_CAP - MARGE_CIBLE, Math.max(2, club().budget * PART_MASSE));
/** Marge salariale réellement disponible (M€). */
const margeSalariale = () => Math.round((masseCible() - masseSalariale(club()))*1000)/1000;
/** Contrôles institutionnels avant toute signature. Renvoie un message d'erreur ou null. */
function controlesRecrutement(p, salaire, indemnite){
  const c = club();
  const masse = masseSalariale(c) + salaire/1000;
  if(masse > SALARY_CAP) return `Commission de régulation : masse salariale ${masse.toFixed(2)} M€, au-dessus du plafond de ${SALARY_CAP} M€.`;
  if(masse > masseCible()) return `Le président refuse : la masse salariale passerait à ${masse.toFixed(2)} M€ pour une cible de ${masseCible().toFixed(2)} M€. Libérez ${(masse-masseCible()).toFixed(2)} M€ en vendant ou en résiliant un contrat.`;
  if(indemnite > state.enveloppe) return `Enveloppe mercato insuffisante : ${state.enveloppe.toFixed(2)} M€ restants pour ${indemnite.toFixed(2)} M€ demandés.`;
  if(state.recruesSaison >= MAX_RECRUES) return `Le staff bloque le dossier : ${MAX_RECRUES} recrues extérieures déjà signées cette saison.`;
  if(!p.jiff && nonJiff(c) >= NON_JIFF_MAX) return `Règle des ${NON_JIFF_MAX} non-JIFF : effectif déjà à ${nonJiff(c)}.`;
  if(c.joueurs.length >= TAILLE_EFFECTIF_MAX) return `Effectif complet (${TAILLE_EFFECTIF_MAX} joueurs).`;
  return null;
}
function envoyerOffre(salaire, duree, indemnite){
  const n = state.negociation; if(!n || n.statut!=="en cours") return {ok:false, texte:"Aucune négociation en cours."};
  const p = joueur(n.pid); const c = club();
  if(!(salaire>0)) return {ok:false, texte:"Indiquez un salaire annuel en k€."};
  const blocage = n.mode==="precontrat" ? null : controlesRecrutement(p, salaire, indemnite);
  if(blocage) return {ok:false, texte:blocage};
  const d = demandesNegociation(p, duree, n.tour, n.mode==="precontrat");
  if(!joueurEcoute(p, duree)) return {ok:false, texte:`${p.nom} refuse un contrat de ${duree} an(s) chez vous : ${motifRefus(p)}.`};
  const okJoueur = salaire >= d.salaire, okClub = indemnite >= d.indemnite;
  n.duree = duree;
  if(okJoueur && okClub){
    if(n.mode==="precontrat"){
      state.preContrats = state.preContrats || []; state.preContrats.push({pid:p.id, salaire, duree, de:p.clubId});
      delete state.dossiers[p.id]; n.statut = "conclu";
      actualite(`Pré-contrat signé : ${p.nom} (${state.equipes[p.clubId].court}) rejoindra le club à l'intersaison.`, "ok");
      return {ok:true, texte:`${p.nom} signe un pré-contrat : il arrivera libre la saison prochaine (${duree} an(s), ${salaire} k€/an).`};
    }
    executerTransfert(p, salaire, duree, indemnite); if(n.joker){ p.joker = true; state.jokerUtilise = true; } n.statut = "conclu"; nettoyerFeuille();
    return {ok:true, texte:`Accord conclu : ${p.nom} signe ${duree} an(s) à ${salaire} k€, indemnité ${indemnite.toFixed(2)} M€.`}; }
  n.historique.push({tour:n.tour, salaire, duree, indemnite, joueur: okJoueur ? "accepte le salaire" : `attend ${d.salaire} k€/an`, club: okClub ? "accepte l'indemnité" : `réclame ${d.indemnite.toFixed(2)} M€`});
  n.tour++;
  const vole = concurrenceJoue(n);
  if(vole){ n.statut = "perdu"; nettoyerFeuille(); return {ok:false, texte:`Trop tard : ${p.nom} vient de signer à ${vole.court}.`}; }
  if(n.tour > 3){ n.statut = "rompu"; p.negoBloquee = state.journee + 4; delete state.dossiers[p.id]; return {ok:false, texte:`Après trois tours sans accord, ${p.nom} et ${state.equipes[p.clubId].court} mettent fin aux discussions.`}; }
  return {ok:false, texte:`Contre-proposition reçue (tour ${n.tour}/3) : voyez les nouvelles exigences ci-dessous.`};
}
function prolonger(pid, salaire, duree){
  const p = joueur(pid); const c = club();
  if(!(salaire>0)) return {ok:false, texte:"Indiquez un salaire annuel en k€."};
  const masse = masseSalariale(c) - p.salaire/1000 + salaire/1000;
  if(masse > SALARY_CAP) return {ok:false, texte:`Prolongation refusée : masse salariale ${masse.toFixed(2)} M€ au-dessus du plafond.`};
  const demande = Math.round(demandeSalariale(p)*0.95);
  if(salaire < demande) return {ok:false, texte:`${p.nom} attend au moins ${demande} k€/an pour prolonger.`};
  p.salaire = salaire; p.contrat = {anneesRestantes:duree};
  return {ok:true, texte:`${p.nom} prolonge ${duree} an(s) à ${salaire} k€/an.`};
}
function resilier(pid){
  const p = joueur(pid); const c = club(); const cout = Math.round(p.salaire*0.3)/1000;
  c.joueurs = c.joueurs.filter(x=>x!==p); c.budget -= cout; delete INDEX[p.id];
  nettoyerFeuille(); actualite(`${p.nom} quitte le club (contrat résilié, indemnité ${cout.toFixed(2)} M€, ${p.salaire} k€ de masse libérée).`, "info");
  return {ok:true, texte:`Contrat de ${p.nom} résilié : ${cout.toFixed(2)} M€ d'indemnité, ${p.salaire} k€ de masse salariale libérée.`};
}
/** Postes où votre effectif est le plus faible (profondeur et niveau). */
function postesFaibles(){
  const c = club();
  return Object.keys(POSTES).map(po => {
    const dispo = c.joueurs.filter(p=>auPoste(p,po)).sort((a,b)=>moyenne(b)-moyenne(a));
    const titulaire = dispo.length ? moyenne(dispo[0]) : 0;
    const doublure = dispo.length>1 ? moyenne(dispo[1]) : 0;
    return {poste:po, nb:dispo.length, titulaire, doublure, score: titulaire*0.6 + doublure*0.3 + Math.min(dispo.length,3)*0.7};
  }).sort((a,b)=>a.score-b.score);
}
/**
 * Rapport du recruteur : pour chaque poste faible, les meilleures cibles du championnat
 * compatibles avec le salary cap, le budget et la règle des non-JIFF.
 */
function rapportRecruteur(){
  const c = club(); const faibles = postesFaibles().slice(0,3); const marge = margeSalariale();
  const pistes = faibles.map(f => {
    const cibles = Object.values(state.equipes).filter(e=>!e.horsChampionnat && e.id!==c.id)
      .flatMap(e=>e.joueurs).filter(p => auPoste(p, f.poste) && p.blessure===0
        && demandeSalariale(p)/1000 <= marge && (indemniteTransfert(p) <= state.enveloppe || (preContratPossible(p) && fenetrePreContrat()))
        && (p.jiff || nonJiff(c) < NON_JIFF_MAX) && moyenne(p) > f.titulaire - 0.5 && joueurEcoute(p, 3))
      .map(p => ({p, note: moyenne(p)*2 + (p.listeTransfert?3:0) + (p.jiff?1.5:0) + (p.contrat.anneesRestantes<=1?4:0) + interetJoueur(p,3)*0.06 - indemniteTransfert(p)*1.2 - (p.age>=33?2:0)}))
      .sort((a,b)=>b.note-a.note).slice(0,4).map(x=>x.p);
    return {...f, cibles};
  });
  return {date:`S${state.saison} J${state.journee+1}`, marge, pistes};
}
const dansShortlist = pid => (state.shortlist||[]).includes(pid);

/** Offres reçues pour vos joueurs : les clubs IA approchent vos cadres pendant les fenêtres. */
function genererOffresRecues(){
  if(!mercatoOuvert().ouvert) return;
  state.offresRecues = (state.offresRecues||[]).filter(o => joueur(o.pid) && joueur(o.pid).clubId===state.clubId && o.expire > state.journee);
  if(state.offresRecues.length >= 3 || Math.random() < 0.55) return;
  const c = club();
  const candidats = c.joueurs.filter(p => p.blessure===0 && (p.listeTransfert || Math.random()<0.5));
  if(!candidats.length) return;
  const p = alea(candidats);
  if(state.offresRecues.some(o=>o.pid===p.id)) return;
  const acheteurs = Object.values(state.equipes).filter(e => !e.horsChampionnat && e.id!==c.id
    && masseSalariale(e) + p.salaire/1000 <= SALARY_CAP && e.joueurs.length < TAILLE_EFFECTIF_MAX && (p.jiff || nonJiff(e) < NON_JIFF_MAX));
  if(!acheteurs.length) return;
  const e = alea(acheteurs);
  const base = indemniteTransfert(p);
  const montant = Math.round(base * (p.listeTransfert ? (0.9 + Math.random()*0.5) : (1 + Math.random()*0.6)) * 100)/100;
  if(montant > e.budget) return;
  state.offresRecues.push({pid:p.id, clubId:e.id, montant, salaire:Math.round(demandeSalariale(p)*1.1), expire: state.journee + 3});
  actualite(`${e.court} propose ${montant.toFixed(2)} M€ pour ${p.nom}. À vous de trancher.`, "info");
}
/** Réponse du manager à une offre reçue. */
function traiterOffreRecue(pid, accepter){
  const o = (state.offresRecues||[]).find(x=>x.pid===pid); if(!o) return {ok:false, texte:"Offre expirée."};
  const p = joueur(pid); const c = club(); const e = state.equipes[o.clubId];
  state.offresRecues = state.offresRecues.filter(x=>x!==o);
  if(!accepter){
    p.moral = clamp((p.moral===undefined?70:p.moral) - (p.listeTransfert ? 15 : 5), 0, 100);
    actualite(`Offre de ${e.court} refusée pour ${p.nom}${p.listeTransfert?" (il espérait partir)":""}.`, "info");
    return {ok:true, texte:`Vous refusez l'offre de ${e.court} pour ${p.nom}.`};
  }
  c.joueurs = c.joueurs.filter(x=>x!==p); c.budget += o.montant; e.budget -= o.montant; state.enveloppe = Math.round((state.enveloppe + o.montant*0.7)*100)/100;
  p.clubId = e.id; p.salaire = o.salaire; p.contrat = {anneesRestantes: 1 + Math.floor(Math.random()*3)}; p.listeTransfert = false; e.joueurs.push(p);
  nettoyerFeuille(); actualite(`${p.nom} est vendu à ${e.court} pour ${o.montant.toFixed(2)} M€ (${p.salaire} k€ de masse salariale libérée).`, "ok");
  return {ok:true, texte:`${p.nom} rejoint ${e.court} : +${o.montant.toFixed(2)} M€ et ${p.salaire} k€ de masse libérée.`};
}
/** Activité des clubs IA à chaque journée : achats de joueurs listés, signatures d'agents libres. */
function marcheIA(){
  const ia = Object.values(state.equipes).filter(e=>e.id!==state.clubId && !e.horsChampionnat);
  if(!mercatoOuvert().ouvert) return;
  for(const p of club().joueurs.filter(p=>p.listeTransfert)){
    if(Math.random()>=0.15) continue;
    const indem = indemniteTransfert(p);
    const ach = ia.filter(e => e.budget>=indem && masseSalariale(e)+p.salaire/1000<=SALARY_CAP && e.joueurs.length<TAILLE_EFFECTIF_MAX && (p.jiff || nonJiff(e)<NON_JIFF_MAX));
    if(!ach.length) continue;
    const e = alea(ach); club().joueurs = club().joueurs.filter(x=>x!==p); club().budget += indem; e.budget -= indem;
    p.clubId = e.id; p.listeTransfert = false; e.joueurs.push(p); nettoyerFeuille();
    actualite(`${p.nom} rejoint ${e.court} pour ${indem.toFixed(2)} M€.`, "ok");
  }
}

/* =====================================================================
   6 bis. CENTRE DE FORMATION
   Chaque club possède un centre (niveau 1 à 5, investissement annuel, espoirs).
   Les espoirs ne font pas partie de l'effectif professionnel : ils n'entrent ni
   dans la masse salariale ni sur la feuille de match tant qu'ils ne sont pas passés pro.
   ===================================================================== */
/** Structure par défaut du centre de formation d'un club. */
function centreFormationDefaut(){ return {niveau:1, budgetInvestissement:CENTRE_BUDGET_DEFAUT, espoirs:[], init:false}; }
/**
 * Renvoie le centre de formation d'un club en le créant si besoin (anciennes sauvegardes incluses).
 * À la première lecture, le club reçoit sa première promotion d'espoirs.
 */
function obtenirCentre(e){
  if(!e.centreFormation) e.centreFormation = centreFormationDefaut();
  const cf = e.centreFormation;
  cf.niveau = clamp(Math.round(cf.niveau||1), 1, CENTRE_NIVEAU_MAX);
  if(!(cf.budgetInvestissement > 0)) cf.budgetInvestissement = CENTRE_BUDGET_DEFAUT;
  if(!Array.isArray(cf.espoirs)) cf.espoirs = [];
  if(!cf.init){ cf.init = true; if(!e.horsChampionnat) genererPromotion(e, e.id===state.clubId); }
  return cf;
}
/** Coût (M€) du passage au niveau supérieur. */
function coutAmeliorationCentre(niveau){ return CENTRE_COUTS[niveau] || 0; }
/** Nombre maximal d'espoirs hébergés selon le niveau des infrastructures. */
function capaciteCentre(cf){ return 6 + cf.niveau * 2; }
/** Bonus lié à l'investissement annuel : un gros budget attire et fait progresser de meilleurs profils. */
function bonusInvestissement(cf){ const b = cf.budgetInvestissement; return b >= 1.5 ? 2 : b >= 1 ? 1 : b <= 0.25 ? -1 : 0; }
/** Salaire (k€/an) d'un premier contrat professionnel. */
function salaireEspoir(es){ return Math.max(50, Math.round(salaireIndicatif(moyenne(es)) * 0.7 / 10) * 10); }
/** Potentiel estimé par le staff : plus le centre est performant, plus l'estimation est précise. */
function potentielEspoirAffiche(es, niveau){
  const marge = niveau >= 5 ? 0 : niveau >= 3 ? 1 : 2;
  if(!marge) return String(es.potentiel);
  const centre = clamp(es.potentiel + (es.biais || 0), 1, 20);
  return `${clamp(centre-marge, 1, 20)}-${clamp(centre+marge, 1, 20)}`;
}
/** Crée un jeune espoir (17-19 ans, 100 % JIFF) selon le niveau et l'investissement du centre. */
function genererEspoir(e, cf){
  const noms = new Set([...e.joueurs.map(p=>p.nom), ...cf.espoirs.map(x=>x.nom)]);
  let nom = "";
  for(let t=0; t<20 && (!nom || noms.has(nom)); t++) nom = `${alea(PRENOMS_ESPOIRS)} ${alea(NOMS_ESPOIRS)}`;
  if(noms.has(nom)) nom += ` (${state.saison})`;
  const poste = alea(Object.keys(POSTES));
  const age = 17 + Math.floor(Math.random()*3);
  const niv = clamp(Math.round(7 + cf.niveau*0.5 + Math.random()*2.5), 6, 14);
  const attr = {};
  for(const [k] of ATTRIBUTS) attr[k] = clamp(Math.round(niv + PROFILS[poste][k] + (Math.floor(Math.random()*3) - 1)), 1, 20);
  const esp = {id:`esp-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`, nom, poste, age, jiff:true, attr,
    perso: alea(LISTE_PERSOS), biais: Math.floor(Math.random()*3) - 1, arrivee: state.saison, potentiel: 0};
  esp.potentiel = clamp(Math.round(moyenne(esp) + 3 + Math.random()*4 + Math.floor(cf.niveau/2) + bonusInvestissement(cf)), Math.ceil(moyenne(esp)) + 1, 20);
  return esp;
}
/** Nouvelle promotion de 3 à 5 espoirs ; au-delà de la capacité, les profils les moins prometteurs sont remerciés. */
function genererPromotion(e, annonce){
  const cf = e.centreFormation; const nb = 3 + Math.floor(Math.random()*3); const arrivees = [];
  for(let i=0; i<nb; i++){ const es = genererEspoir(e, cf); cf.espoirs.push(es); arrivees.push(es); }
  const cap = capaciteCentre(cf);
  if(cf.espoirs.length > cap){
    const garde = [...cf.espoirs].sort((a,b)=>(b.potentiel+moyenne(b)) - (a.potentiel+moyenne(a))).slice(0, cap);
    const ecartes = cf.espoirs.filter(x=>!garde.includes(x));
    cf.espoirs = cf.espoirs.filter(x=>garde.includes(x));
    if(annonce && ecartes.length) actualite(`Centre de formation plein : ${ecartes.map(x=>x.nom).join(", ")} ne sont pas conservés.`, "info");
  }
  if(annonce) actualite(`Centre de formation : promotion ${state.saison} — ${arrivees.map(x=>`${x.nom} (${x.poste}, ${x.age} ans)`).join(", ")} intègrent la formation.`, "ok");
}
/** Intersaison : progression des espoirs, vieillissement, départs, investissement annuel et nouvelle promotion. */
function intersaisonCentreFormation(){
  const cles = ATTRIBUTS.map(a=>a[0]);
  for(const e of Object.values(state.equipes)){
    if(e.horsChampionnat) continue;
    const cf = obtenirCentre(e); const moi = e.id===state.clubId;
    for(const es of cf.espoirs){
      const pas = 2 + cf.niveau + bonusInvestissement(cf) + (es.perso==="bosseur" ? 1 : 0) + Math.floor(Math.random()*2);
      for(let i=0; i<pas && moyenne(es) < es.potentiel; i++){
        const dispo = cles.filter(k=>es.attr[k] < 20); if(!dispo.length) break;
        const k = alea(dispo); es.attr[k] = clamp(es.attr[k]+1, 1, 20);
      }
      es.age++;
    }
    const partants = cf.espoirs.filter(es=>es.age > CENTRE_AGE_MAX);
    cf.espoirs = cf.espoirs.filter(es=>es.age <= CENTRE_AGE_MAX);
    if(moi){
      if(partants.length) actualite(`Centre de formation : ${partants.map(x=>x.nom).join(", ")} quitte(nt) le centre sans contrat professionnel.`, "info");
      e.budget = Math.round((e.budget - cf.budgetInvestissement)*100)/100;
      actualite(`Centre de formation : investissement annuel de ${cf.budgetInvestissement.toFixed(2)} M€ prélevé sur le budget.`, "info");
    }
    genererPromotion(e, moi);
  }
}
/** Améliore les infrastructures du centre du club géré (payé sur le budget du club). */
function ameliorerCentre(){
  const c = club(); const cf = obtenirCentre(c);
  if(cf.niveau >= CENTRE_NIVEAU_MAX) return {ok:false, texte:"Le centre de formation est déjà au niveau maximal."};
  const cout = coutAmeliorationCentre(cf.niveau);
  if(c.budget < cout) return {ok:false, texte:`Budget insuffisant : ${cout.toFixed(2)} M€ nécessaires, ${c.budget.toFixed(2)} M€ disponibles.`};
  c.budget = Math.round((c.budget - cout)*100)/100; cf.niveau++;
  actualite(`Centre de formation porté au niveau ${cf.niveau} (${cout.toFixed(2)} M€ investis).`, "ok");
  return {ok:true, texte:`Centre de formation amélioré : niveau ${cf.niveau}/${CENTRE_NIVEAU_MAX}.`};
}
/** Motif bloquant la signature pro d'un espoir, ou null si elle est possible. */
function blocagePassagePro(es){
  const c = club();
  if(c.joueurs.length >= TAILLE_EFFECTIF_MAX) return `Effectif complet (${TAILLE_EFFECTIF_MAX} joueurs maximum).`;
  const masse = masseSalariale(c) + salaireEspoir(es)/1000;
  if(masse > SALARY_CAP) return `Salary cap : la masse salariale passerait à ${masse.toFixed(2)} M€ (plafond ${SALARY_CAP} M€).`;
  return null;
}
/** Signe un espoir dans l'effectif professionnel (contrat de 3 ans). */
function passerPro(espId){
  const c = club(); const cf = obtenirCentre(c);
  const es = cf.espoirs.find(x=>x.id===espId); if(!es) return {ok:false, texte:"Espoir introuvable."};
  const blocage = blocagePassagePro(es); if(blocage) return {ok:false, texte:blocage};
  const salaire = salaireEspoir(es);
  const j = creerJoueur([es.nom, es.poste, "", es.age, 1, Math.round(moyenne(es)), salaire], c.id, 0);
  j.attr = {...es.attr}; j.potentiel = es.potentiel; j.perso = es.perso; j.formeAuClub = true; j.contrat = {anneesRestantes:3};
  c.joueurs.push(j); INDEX[j.id] = j;
  cf.espoirs = cf.espoirs.filter(x=>x!==es);
  actualite(`${j.nom} (${POSTES[j.poste]}, ${j.age} ans) signe son premier contrat professionnel : 3 ans à ${salaire} k€/an.`, "ok");
  return {ok:true, texte:`${j.nom} passe pro : 3 ans à ${salaire} k€/an. Il rejoint l'effectif principal.`};
}

/* =====================================================================
   6 ter. CALENDRIER RÉEL & VIE QUOTIDIENNE
   La saison se vit jour par jour, du premier lundi d'août à la finale de fin juin.
   Semaines de préparation, semaines de match (coup d'envoi le samedi), week-offs,
   trêve hivernale et phase finale. Le nombre de matchs reste de 26 journées.
   ===================================================================== */
const JOUR_MS = 86400000;
const JOUR_MATCH = 5;                                          // 0 = lundi ... 5 = samedi
/**
 * Modèle de saison, une lettre par semaine à partir du premier lundi d'août :
 * P préparation · M journée de championnat · O week-off · T trêve hivernale · B barrages · D demi-finales · F finale.
 * 26 « M » exactement : le nombre de matchs ne change pas.
 */
const MODELE_SAISON = "PPPP" + "MMMOMMMOMMOOMMOMMTTMMOMMOMOMMOMMOMMOMMM" + "BDOF";
/** Cycles automatiques de la préparation estivale (un par semaine). */
const CYCLES_PREPA = [
  {nom:"Reprise foncière", axe:"defense", intensite:"intense"},
  {nom:"Puissance et conquête", axe:"melee", intensite:"intense"},
  {nom:"Vitesse et jeu déployé", axe:"vitesse", intensite:"normale"},
  {nom:"Affûtage et automatismes", axe:"pied", intensite:"legere"}
];
const TYPES_SEMAINE = {
  prepa: {nom:"Préparation", court:"Prépa", badge:"badge-liste", desc:"Préparation estivale : cycles d'entraînement automatiques, grosse charge physique."},
  match: {nom:"Semaine de match", court:"Match", badge:"badge-capitaine", desc:"Récupération en début de semaine, séance clé le jeudi, match le samedi."},
  off:   {nom:"Week-off", court:"Off", badge:"badge-perso", desc:"Pas de match ce week-end : soins et récupération renforcée."},
  treve: {nom:"Trêve hivernale", court:"Trêve", badge:"badge-forme-club", desc:"Congés : récupération maximale, blessures soignées plus vite."},
  phase: {nom:"Phase finale", court:"Phase", badge:"badge-capitaine", desc:"Phase finale : chaque match est décisif."}
};
/** Forme récupérée chaque jour selon le type de semaine (tous les clubs). */
const GAIN_FORME_JOUR = {prepa:2, match:4, phase:4, off:7, treve:9};
const JOURS_COURTS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const NOMS_ETAPES = {barrages:"Barrages", demis:"Demi-finales", finale:"Finale"};

const isoDate = d => d.toISOString().slice(0,10);
const dateUTC = iso => { const [a,m,j] = iso.split("-").map(Number); return new Date(Date.UTC(a, m-1, j)); };
const ajouterJours = (iso, n) => isoDate(new Date(dateUTC(iso).getTime() + n*JOUR_MS));
const joursEntre = (a, b) => Math.round((dateUTC(b) - dateUTC(a)) / JOUR_MS);
function formatDate(iso, court){
  if(!iso) return "—";
  return dateUTC(iso).toLocaleDateString("fr-FR", court ? {timeZone:"UTC", weekday:"short", day:"numeric", month:"short"}
    : {timeZone:"UTC", weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
/** Premier lundi d'août de la saison (saison 1 = 2026-2027). */
function debutSaison(saison){
  const d = new Date(Date.UTC(2025 + saison, 7, 1));
  while(d.getUTCDay() !== 1) d.setTime(d.getTime() + JOUR_MS);
  return isoDate(d);
}
let cachePlanning = {saison:null, plan:null};
/** Planning semaine par semaine de la saison (calculé, jamais sauvegardé). */
function planningSaison(saison){
  if(cachePlanning.saison===saison) return cachePlanning.plan;
  const debut = debutSaison(saison); let journee = 0, prepa = 0;
  const etapes = {B:"barrages", D:"demis", F:"finale"};
  const plan = MODELE_SAISON.split("").map((code, i) => {
    const w = {i, debut: ajouterJours(debut, i*7), code};
    if(code==="P"){ w.type = "prepa"; w.cycle = CYCLES_PREPA[prepa++ % CYCLES_PREPA.length]; }
    else if(code==="M"){ w.type = "match"; w.journee = ++journee; }
    else if(code==="O") w.type = "off";
    else if(code==="T") w.type = "treve";
    else { w.type = "phase"; w.etape = etapes[code]; }
    return w;
  });
  cachePlanning = {saison, plan}; return plan;
}
/** Où en est-on ? Semaine courante et jour de la semaine (0 = lundi). */
function infoJour(){
  const plan = planningSaison(state.saison);
  const ecart = joursEntre(plan[0].debut, state.date);
  const iw = clamp(Math.floor(ecart/7), 0, plan.length-1);
  return {plan, iw, semaine:plan[iw], jour: ((ecart % 7) + 7) % 7};
}
function dateMatchJournee(n){ const w = planningSaison(state.saison).find(x=>x.journee===n); return w ? ajouterJours(w.debut, JOUR_MATCH) : null; }
function dateEtape(etape){ const w = planningSaison(state.saison).find(x=>x.etape===etape); return w ? ajouterJours(w.debut, JOUR_MATCH) : null; }
/** Date cohérente pour une sauvegarde qui n'en possède pas encore (versions précédentes). */
function dateParDefaut(){
  const plan = planningSaison(state.saison);
  if(state.phase){
    if(state.phase.etape==="terminee") return ajouterJours(plan[plan.length-1].debut, JOUR_MATCH);
    const w = plan.find(x=>x.etape===state.phase.etape); return w ? w.debut : plan[plan.length-1].debut;
  }
  if(state.journee===0) return plan[0].debut;
  const w = plan.find(x=>x.journee===state.journee+1); return w ? w.debut : plan[0].debut;
}
function assurerDate(){ if(!state.date) state.date = dateParDefaut(); }
/** Un match (du championnat ou de la phase finale) doit-il se jouer aujourd'hui ? */
function jourDeMatchEnAttente(){
  if(!state.date) return false;
  const {semaine, jour} = infoJour(); if(jour!==JOUR_MATCH) return false;
  if(semaine.type==="match") return !state.phase && state.journee+1===semaine.journee;
  if(semaine.type==="phase") return !!state.phase && state.phase.etape===semaine.etape;
  return false;
}
function joueurConcerne(){ if(!state.phase) return true; return matchsEtapeCourante().some(mt=>mt.dom===state.clubId||mt.ext===state.clubId); }
/** Votre club joue aujourd'hui et vous êtes aux commandes : la journée ne peut pas passer sans ce match. */
function matchJoueurAujourdhui(){ return jourDeMatchEnAttente() && joueurConcerne() && !state.licencie; }
/** Simule instantanément le(s) match(s) du jour, celui de votre club compris. */
function simulerMatchDuJour(){
  if(!state.phase){ clorePeriodeJournee(); return; }
  for(const mt of matchsEtapeCourante().filter(x=>!x.resultat)){
    const m = simulerInstantane(preparerMatch(mt.dom, mt.ext, {type:"phase"})); appliquerEffetsJoueurs(m);
    mt.resultat = {sd:m.dom.score, se:m.ext.score, ed:m.dom.essais, ee:m.ext.essais, rapport:m.rapportCle};
  }
  clorePhase();
}
/** Effets du jour qui commence : récupération, soins, entraînements, annonces, événements. */
function effetsDuJour(info){
  const {semaine:w, jour} = info;
  for(const e of Object.values(state.equipes)) for(const p of e.joueurs){
    p.forme = clamp(Math.round(p.forme + (GAIN_FORME_JOUR[w.type] || 4)), 5, 100);
    if(jour===0) p.blessure = Math.max(0, p.blessure-1);                                     // les blessures se comptent en semaines
    if(jour===6 && (w.type==="off" || w.type==="treve")) p.blessure = Math.max(0, p.blessure-1); // soins renforcés hors match
  }
  if(state.licencie) return;
  if(jour===0){
    if(w.type==="prepa") actualite(`Préparation estivale, semaine ${w.i+1} : cycle « ${w.cycle.nom} ».`, "info");
    else if(w.type==="off") actualite(`Week-off : pas de match ce week-end, le staff médical en profite pour soigner les organismes.`, "info");
    else if(w.type==="treve") actualite(`Trêve hivernale : le groupe part en congés et recharge les batteries.`, "info");
  }
  if(jour===3 && (w.type==="match" || (w.type==="phase" && joueurConcerne()))) entrainementSemaine();
  if(jour===4 && w.type==="prepa") entrainementSemaine({axe:w.cycle.axe, intensite:w.cycle.intensite});
  evenementDuJour(info);
}
/** Passe au jour suivant. Renvoie un message si quelque chose bloque. */
function passerJour(){
  if(state.evenement) return {ok:false, texte:"Une décision vous attend avant de poursuivre."};
  if(jourDeMatchEnAttente()){
    if(joueurConcerne() && !state.licencie) return {ok:false, texte:"Jour de match : jouez votre rencontre en direct ou simulez-la depuis le tableau de bord."};
    simulerMatchDuJour();                                                                    // match des autres clubs, joué d'office
  }
  if(state.phase && state.phase.etape==="terminee") return null;
  state.date = ajouterJours(state.date, 1);
  effetsDuJour(infoJour());
  nettoyerFeuille();                                                                         // un joueur blessé dans la journée quitte la feuille
  return null;
}
function avancerJour(){
  if(matchCourant){ state.ecran = "match"; render(); return; }
  if(state.phase && state.phase.etape==="terminee"){ nouvelleSaison(); return; }
  const r = passerJour(); if(r) state.messageMarche = r;
  sauvegarder(); render();
}
/** Simule jusqu'au lundi suivant, matchs compris ; s'arrête sur une décision à prendre. */
function avancerSemaine(){
  if(matchCourant){ state.ecran = "match"; render(); return; }
  if(state.phase && state.phase.etape==="terminee"){ nouvelleSaison(); return; }
  let n = 0;
  do {
    if(state.evenement || (state.phase && state.phase.etape==="terminee")) break;
    if(jourDeMatchEnAttente()) simulerMatchDuJour();
    const r = passerJour(); if(r){ state.messageMarche = r; break; }
  } while(infoJour().jour!==0 && ++n < 8);
  sauvegarder(); render();
}
/** Avance jusqu'au prochain match de votre club (ou jusqu'à une décision à prendre). */
function avancerJusquauMatch(){
  if(matchCourant){ state.ecran = "match"; render(); return; }
  for(let n=0; n<70 && !matchJoueurAujourdhui() && !state.evenement; n++){
    if(state.phase && state.phase.etape==="terminee") break;
    const r = passerJour(); if(r){ state.messageMarche = r; break; }
  }
  state.ecran = "dashboard"; sauvegarder(); render();
}

/** Tirage quotidien : environ un événement par semaine et demie, plus fréquent hors semaines de match. */
function evenementDuJour(info){
  if(state.licencie || state.evenement) return;
  const t = info.semaine.type;
  if((t==="match" || t==="phase") && info.jour===JOUR_MATCH) return;                   // pas d'imprévu le jour du match
  const proba = 0.09 * ((t==="match" || t==="phase") ? 1 : 1.35);
  if(Math.random() >= proba) return;
  const c = club(); const recents = state.evtRecents || [];
  const eligibles = EVENEMENTS.filter(e => !e.condition || e.condition(c, info));
  const neufs = eligibles.filter(e=>!recents.includes(e.id)); const pool = neufs.length ? neufs : eligibles;
  let r = Math.random() * pool.reduce((s,e)=>s+e.poids, 0); let choisi = pool[pool.length-1];
  for(const e of pool){ r -= e.poids; if(r < 0){ choisi = e; break; } }
  const ev = choisi.creer(c, info); if(!ev) return;
  state.evtRecents = [choisi.id, ...recents].slice(0, 5);
  if(ev.options) state.evenement = {...ev, id:choisi.id, date:state.date};
  else actualite(ev.texte, ev.type || "info");
}
function resoudreEvenement(choix){
  const ev = state.evenement; if(!ev) return null; state.evenement = null;
  const def = EVENEMENTS.find(e=>e.id===ev.id); if(!def || !def.resoudre) return null;
  const r = def.resoudre(ev, choix, club()); actualite(r.texte, r.type || "info");
  return {ok: r.type!=="erreur", texte:r.texte};
}

/** Écusson SVG original, construit à partir de la couleur du club et de ses initiales. */
function ecussonSVG(id, taille){
  const e = state.equipes ? state.equipes[id] : null;
  const conf = ECUSSONS[id] || {forme:"ecu", c2:"#111", motif:"bande"};
  const c1 = e ? e.couleur : "#d9a648"; const c2 = conf.c2;
  const nom = e ? e.court : id;
  const ini = nom.split(/[\s-']/).filter(Boolean).map(x=>x[0]).join("").slice(0,3).toUpperCase();
  const txt = couleurTexte(c1);
  const formes = {
    bouclier: `<path d="M50 4 L92 18 V54 C92 78 72 92 50 98 C28 92 8 78 8 54 V18 Z"/>`,
    ecu:      `<path d="M8 6 H92 V58 C92 80 72 92 50 98 C28 92 8 80 8 58 Z"/>`,
    rond:     `<circle cx="50" cy="52" r="46"/>`
  };
  const motifs = {
    croix:   `<path d="M42 10 H58 V44 H92 V60 H58 V96 H42 V60 H8 V44 H42 Z" fill="${c2}" opacity=".85"/>`,
    chevron: `<path d="M8 30 L50 58 L92 30 V50 L50 78 L8 50 Z" fill="${c2}" opacity=".8"/>`,
    bande:   `<path d="M8 38 H92 V62 H8 Z" fill="${c2}" opacity=".85"/>`,
    ciel:    `<path d="M8 6 H92 V40 H8 Z" fill="${c2}" opacity=".8"/>`,
    eclair:  `<path d="M56 8 L30 54 H48 L40 96 L74 42 H54 Z" fill="${c2}" opacity=".85"/>`
  };
  const t = taille || 34;
  return `<svg class="ecusson-svg" width="${t}" height="${t}" viewBox="0 0 100 104" aria-label="Écusson ${echapper(nom)}" role="img">
    <defs><clipPath id="cp-${id}"><g fill="#fff">${formes[conf.forme]}</g></clipPath></defs>
    <g fill="${c1}">${formes[conf.forme]}</g>
    <g clip-path="url(#cp-${id})">${motifs[conf.motif]}</g>
    <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3">${formes[conf.forme]}</g>
    <text x="50" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="${txt}" style="paint-order:stroke" stroke="rgba(0,0,0,.35)" stroke-width="1">${echapper(ini)}</text>

/** Match de votre club dans une semaine donnée (texte court, score s'il est joué). */
function matchSemaine(w){
  if(w.type==="match"){
    const j = state.calendrier[w.journee-1]; const mt = j && j.matchs.find(x=>x.dom===state.clubId||x.ext===state.clubId);
    if(!mt) return `Journée ${w.journee}`;
    const dom = mt.dom===state.clubId; const adv = state.equipes[dom?mt.ext:mt.dom]; const r = mt.resultat;
    return `J${w.journee} ${dom?"contre":"à"} ${adv.court}${r ? ` (${dom?r.sd:r.se}-${dom?r.se:r.sd})` : ""}`;
  }
  return NOMS_ETAPES[w.etape] || "Phase finale";
}
/** Programme type de chaque jour, selon le type de semaine. */
function libelleJour(w, j){
  if(w.type==="treve") return "Congés";
  if(w.type==="off") return ["Soins","Récupération active","Séance légère","Soins","Repos","Repos","Repos"][j];
  if(w.type==="prepa") return j<4 ? w.cycle.nom : j===4 ? "Bilan du cycle" : j===5 ? "Opposition interne" : "Repos";
  if(j===JOUR_MATCH) return "Match : " + matchSemaine(w);
  return ["Récupération","Vidéo et musculation","Entraînement collectif","Séance clé","Mise en place","","Repos"][j];
}

function anneau(pourcent, couleur, taille){

      style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 5px ${couleur})"/>

}

/* ---- Effectif & feuille de match -------------------------------------- */
function renderEffectif(){
  const c = club(); const {cle, desc} = state.tri;
  const val = p => cle==="perso" ? PERSONNALITES[p.perso].nom : cle==="moy" ? moyenne(p) : cle==="contrat" ? p.contrat.anneesRestantes : cle==="potentiel" ? (p.potentiel||0) : cle==="noteMoy" ? (p.stats.matchs ? (p.stats.sommeNotes||0)/p.stats.matchs : 0) : cle in p.attr ? p.attr[cle] : p[cle];
  const filtreN = (state.filtreNom||"").toLowerCase(), filtreP = state.filtrePoste||"";
  const joueurs = c.joueurs.filter(p => (!filtreP || auPoste(p, filtreP)) && (!filtreN || p.nom.toLowerCase().includes(filtreN))).sort((a,b) => { const va = val(a), vb = val(b); const r = typeof va==="string" ? va.localeCompare(vb,"fr") : va-vb; return desc ? -r : r; });
  const th = (k, lib) => `<th class="triable" data-action="trier" data-cle="${k}">${lib}${cle===k?(desc?" ▼":" ▲"):""}</th>`;
  const note = n => `<td class="num ${n>=16?'n-haut':n<=8?'n-bas':''}">${n}</td>`;
  const jauge = f => `<span class="jauge ${f<40?'faible':f<70?'moyen':''}"><i style="width:${f}%"></i></span> <span class="petit muet">${f}</span>`;
  const f = state.feuille; const erreurs = verifierFeuille(f, c.id); const nb = compterJiff(f);
  const POSITIONS = [[25,14],[50,14],[75,14],[38,27],[62,27],[17,38],[83,38],[50,40],[50,53],[33,63],[12,81],[53,69],[70,76],[88,81],[50,91]];
  const court = nom => { const t = nom.split(" "); return t.length>1 ? t.slice(1).join(" ") : nom; };
  const slot = (type, i, po, style) => { const id = type==="t" ? f.titulaires[i] : f.banc[i]; const p = id && joueur(id); const cle = `${type}-${i}`;
    const cls = ["slotpitch", state.slotSel===cle?"actif":"", !p?"vide":"", p && type==="t" && !auPoste(p,po) ? "hors":""].join(" ");
    const estBomb = p && state.feuille.specialistes && (state.feuille.specialistes.bombSquad||[]).includes(p.id);
    return `<button class="${cls}${estBomb?" bomb":""}" style="${style}" data-action="choisir-slot" data-slot="${cle}" data-drop="${cle}" ${p?`draggable="true" data-dragpid="${p.id}" data-dragfrom="${cle}"`:""} title="${type==="t"?POSTES[po]:"Remplaçant"}"><span class="num">${type==="t"?i+1:16+i}</span><span class="nom">${p?echapper(court(p.nom)):(type==="t"?POSTES[po]:"Remplaçant")}</span>${p?`<span class="note">${moyenne(p).toFixed(1)} · ${p.poste}${estBomb?" 💥":""}${state.feuille.specialistes&&state.feuille.specialistes.buteur1===p.id?" 🎯":""}</span><span class="jf"><i style="width:${p.forme}%"></i></span>`:""}</button>`; };
  const terrain = `<div class="terrain"><div class="enbut"></div>${POSTE_PAR_NUMERO.map((po,i)=>slot("t",i,po,`left:${POSITIONS[i][0]}%;top:${POSITIONS[i][1]}%`)).join("")}</div>
    <div class="banc">${POSTES_BANC.map((po,i)=>slot("b",i,po,"")).join("")}</div>`;
  let panneau = `<p class="muet">Touchez une place sur le terrain ou sur le banc pour choisir le joueur, ou glissez-déposez les pastilles entre elles. Un cadre rouge signale un joueur hors de son poste (−10 %). Chaque pastille indique la note et la forme.</p>`;
  if(state.slotSel){
    const [type, idx] = state.slotSel.split("-"); const i = +idx; const po = type==="t" ? POSTE_PAR_NUMERO[i] : POSTES_BANC[i]; const actuel = type==="t" ? f.titulaires[i] : f.banc[i];
    const dejaPlace = new Set([...f.titulaires, ...f.banc].filter(Boolean));
    const ligne = p => `<button class="btn btn-petit" data-action="placer" data-pid="${p.id}" draggable="true" data-dragpid="${p.id}" ${p.blessure?"disabled":""}><span>${echapper(p.nom)} <span class="petit muet">${p.poste}${p.poste2?"/"+p.poste2:""}</span> ${p.jiff?'<span class="badge badge-jiff">J</span>':''} ${p.blessure?'<span class="badge badge-blesse">blessé</span>':''} ${dejaPlace.has(p.id)&&p.id!==actuel?'<span class="petit muet">(déjà aligné)</span>':''}</span><span class="moy">${moyenne(p).toFixed(1)}</span></button>`;
    const tri = (a,b) => moyenne(b)-moyenne(a);
    const auP = (type==="t" ? c.joueurs.filter(p=>auPoste(p,po)) : [...c.joueurs]).sort(tri), hors = type==="t" ? c.joueurs.filter(p=>!auPoste(p,po)).sort(tri) : [];
    panneau = `<h3>Place ${type==="t"?i+1:16+i} — ${type==="t"?POSTES[po]:"Remplaçant (poste libre)"}</h3>
      <div class="actions" style="margin:0 0 .5rem"><button class="btn btn-petit" data-action="vider-slot">Vider la place</button><button class="btn btn-petit" data-action="fermer-slot">Fermer</button></div>
      <div class="choix">${auP.map(ligne).join("")}${hors.length?`<div class="petit muet" style="margin-top:.4rem">Hors poste (−10 %)</div>`:""}${type==="t"?hors.map(ligne).join(""):""}</div>`;
  }
  return `<div class="carte"><h1>Effectif — ${echapper(c.nom)}</h1>
    <p class="muet petit">${c.joueurs.length} joueurs · ${c.joueurs.filter(p=>p.jiff).length} JIFF · masse salariale ${masseSalariale(c).toFixed(2)} / ${SALARY_CAP} M€. Cliquez sur un nom pour ouvrir sa fiche, sur un en-tête pour trier.</p>
    <div class="filtres"><input type="text" placeholder="Rechercher un joueur" value="${echapper(state.filtreNom||"")}" data-filtre="nom"><select data-filtre="poste"><option value="">Tous les postes</option>${Object.keys(POSTES).map(po=>`<option value="${po}" ${filtreP===po?"selected":""}>${POSTES[po]}</option>`).join("")}</select></div>
    <div class="defilable"><table class="tbl fige"><thead><tr>${th("nom","Joueur")}${th("poste","Poste")}${th("age","Âge")}${th("jiff","JIFF")}${ATTRIBUTS.map(([k,l,ab])=>th(k,ab)).join("")}${th("moy","Moy.")}${th("potentiel","Pot.")}${th("noteMoy","Note")}${th("perso","Caractère")}${th("forme","Forme")}${th("salaire","Salaire")}${th("contrat","Contrat")}<th>Statut</th><th>M / E</th></tr></thead>
    <tbody>${joueurs.map(p=>`<tr><td><button class="lien-joueur" data-action="fiche" data-pid="${p.id}">${echapper(p.nom)}</button></td><td>${POSTES[p.poste]}${p.poste2?` <span class="petit muet">/ ${POSTES[p.poste2]}</span>`:""}</td><td class="num">${p.age}</td><td>${badgeJiff(p)}</td>${ATTRIBUTS.map(([k])=>note(p.attr[k])).join("")}<td class="num moy">${moyenne(p).toFixed(1)}</td><td class="num muet">${potentielAffiche(p)}</td><td>${p.stats.matchs&&p.stats.sommeNotes?badgeNote(Math.round(p.stats.sommeNotes/p.stats.matchs*10)/10):'<span class="muet">–</span>'}</td><td><span class="badge badge-perso">${PERSONNALITES[p.perso].nom}</span>${p.formeAuClub?' <span class="badge badge-forme-club">formé ici</span>':""}${state.capitaine===p.id?' <span class="badge badge-capitaine">capitaine</span>':""}</td><td>${jauge(p.forme)}</td><td class="num">${p.salaire} k€</td><td class="num">${p.contrat.anneesRestantes} an(s)</td>
      <td>${p.blessure>0?`<span class="badge badge-blesse">Blessé ${p.blessure} sem.</span>`:p.listeTransfert?'<span class="badge badge-liste">Transférable</span>':'<span class="petit muet">Disponible</span>'}</td><td class="num">${p.stats.matchs} / ${p.stats.essais}</td></tr>`).join("")}</tbody></table></div>
    <p class="petit muet">${ATTRIBUTS.map(([k,l,ab])=>`${ab} = ${l}`).join(", ")}. Pot. = potentiel (niveau maximal atteignable, joueurs de 26 ans et moins). M / E = matchs / essais.</p></div>
  <h1>Feuille de match</h1>
  <div class="grille grille-2">
    <div class="carte">${terrain}</div>
    <div><div class="carte panneau">${panneau}</div>
      <div class="carte"><h2>Contrôle JIFF</h2><p><span class="compteur ${nb>=MIN_JIFF?'ok':'ko'}">${nb}</span> <span class="muet">/ ${MIN_JIFF} minimum sur 23</span></p>
      <p class="petit muet">Moyenne saisonnière : <strong>${(moyenneJiffSaison()===null?"–":moyenneJiffSaison().toFixed(2))}</strong> (objectif ${MIN_JIFF}, plancher ${JIFF_PLANCHER} par feuille). Non-JIFF sous contrat : ${nonJiff(c)}/${NON_JIFF_MAX}.</p>
      ${erreurs.length?`<ul class="erreurs">${erreurs.map(e=>`<li>${e}</li>`).join("")}</ul>`:`<span class="badge badge-ok">Feuille valide</span>`}
      <div class="actions"><button class="btn" data-action="auto-compo">Composer automatiquement</button><button class="btn btn-primaire" data-action="nav" data-ecran="tactique">Choisir la tactique</button></div></div></div>
  </div>`;
}

/* ---- Statistiques du championnat --------------------------------------- */
/** Tous les joueurs du championnat, avec leurs statistiques de la saison. */
function tousJoueurs(){ return Object.values(state.equipes).filter(e=>!e.horsChampionnat).flatMap(e=>e.joueurs); }
/** Classement des meilleurs marqueurs d'essais. */
function meilleursMarqueurs(n){
  return tousJoueurs().filter(p=>p.stats.essais>0).sort((a,b)=>b.stats.essais-a.stats.essais || b.stats.matchs-a.stats.matchs).slice(0, n||10);
}
/** Classement des meilleures moyennes (à partir de 5 matchs joués). */
function meilleuresMoyennes(n){
  return tousJoueurs().filter(p=>p.stats.matchs>=5 && p.stats.sommeNotes)
    .map(p=>({p, moy:p.stats.sommeNotes/p.stats.matchs})).sort((a,b)=>b.moy-a.moy).slice(0, n||10);
}
/** Équipe type de la saison : le mieux noté à chaque numéro de maillot. */
function equipeType(){
  const parPoste = {};
  for(const p of tousJoueurs()){
    if(p.stats.matchs < 4 || !p.stats.sommeNotes) continue;
    const moy = p.stats.sommeNotes / p.stats.matchs;
    POSTE_PAR_NUMERO.forEach((po, i) => {
      if(!auPoste(p, po)) return;
      if(!parPoste[i] || moy > parPoste[i].moy) parPoste[i] = {p, moy};
    });
  }
  return POSTE_PAR_NUMERO.map((po, i) => ({num:i+1, poste:po, ...(parPoste[i]||{})}));
}
/** Forme récente d'un club (5 derniers matchs) et moyenne de points. */
function formeClub(id){
  const res = []; let pm = 0, pe = 0;
  for(const j of state.calendrier) for(const mt of j.matchs) if(mt.resultat && (mt.dom===id||mt.ext===id)){
    const dom = mt.dom===id; const pp = dom?mt.resultat.sd:mt.resultat.se, pc = dom?mt.resultat.se:mt.resultat.sd;
    res.push(pp>pc?"V":pp===pc?"N":"D"); pm += pp; pe += pc;
  }
  return {serie:res.slice(-5), matchs:res.length, pm, pe};
}
/** Fiche d'avant-match : forme de l'adversaire, style, joueurs à surveiller. */
function ficheAdversaire(id){
  const e = state.equipes[id]; const f = formeClub(id); const cl = classementTrie();
  const rang = cl.findIndex(l=>l.id===id)+1;
  const compo = compositionAuto(id); const ids = compo.titulaires.filter(Boolean);
  const pack = ids.slice(0,8).reduce((s,x)=>s+joueur(x).attr.puis,0)/8;
  const vitesse = ids.slice(8).reduce((s,x)=>s+joueur(x).attr.vit,0)/7;
  const style = TACTIQUES[tactiqueIA(compo)].nom;
  const dangers = e.joueurs.filter(p=>p.blessure===0).map(p=>({p, score: moyenne(p)*1.5 + p.stats.essais*2 + (p.stats.matchs?p.stats.sommeNotes/p.stats.matchs:0)}))
    .sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.p);
  const absents = e.joueurs.filter(p=>p.blessure>0).slice(0,4);
  return {e, rang, forme:f, pack:pack.toFixed(1), vitesse:vitesse.toFixed(1), style, dangers, absents};
}

    manager = `<div class="carte"><h2>Banc de touche — ${m.minute===0?"avant le coup d'envoi":m.minute===40?"mi-temps":"pause"}</h2>

  const scoreCle = m.dom.score + "-" + m.ext.score;
  const pulse = (state.dernierScore !== undefined && state.dernierScore !== scoreCle) ? " pulse" : "";
  state.dernierScore = scoreCle;

      <div class="bandeau">

        <span class="poteau d"><i class="v v1"></i><i class="v v2"></i><i class="h"></i></span>
        <span class="lgn pointille" style="left:26.5%"></span>

        <span class="nom-zone g">${echapper(D.court)}</span><span class="nom-zone d">${echapper(E.court)}</span>
        <span class="marque-m" style="left:26.5%">22 m</span><span class="marque-m" style="left:73.5%">22 m</span>
        <span class="phase">${echapper(phaseEnCours(m))}</span>

      </div>
      <div class="sequence"><span><strong>${echapper(m.sequence || "")}</strong></span><span>Ballon à <strong>${echapper(m.possesseur==="dom"?D.court:E.court)}</strong> · ${mArret} m de l'en-but</span></div>
      <div class="sous-bandeau"><span>${m.contexte.type==="phase"?"Phase finale":`Journée ${state.calendrier[state.journee].numero}`} · ${echapper(D.stade)}</span>
        <span>Possession <span class="pos-val">${pos} %</span> – <span class="pos-val">${100-pos} %</span></span></div>
      <div class="timeline"><span class="mt"></span>${timeline}</div>
    </div>
    ${barre}${alerte}
    <div class="grille grille-2"><div><div class="carte"><div class="actions" style="margin:0">${controles}</div></div>${manager}
      <div class="onglets"><button class="${filtre==="tout"?'actif':''}" data-action="filtre-fil" data-f="tout">Tout le match</button><button class="${filtre==="forts"?'actif':''}" data-action="filtre-fil" data-f="forts">Temps forts</button></div>
      <div class="fil">${feed||`<div class="evt info"><span class="min"></span><span>Le fil du match apparaîtra ici minute par minute.</span></div>`}</div></div>

        <span class="d">${m.dom.essais}</span><span class="l">Essais</span><span>${m.ext.essais}</span>
        <span class="d">${m.dom.pens}</span><span class="l">Pénalités</span><span>${m.ext.pens}</span>

        <span class="d">${m.dom.melees.g}/${m.dom.melees.g+m.dom.melees.p}</span><span class="l">Mêlées gagnées</span><span>${m.ext.melees.g}/${m.ext.melees.g+m.ext.melees.p}</span>
        <span class="d">${m.dom.touches.g}/${m.dom.touches.g+m.dom.touches.p}</span><span class="l">Touches gagnées</span><span>${m.ext.touches.g}/${m.ext.touches.g+m.ext.touches.p}</span>

        <span class="d">${m.dom.rouges}</span><span class="l">Rouges</span><span>${m.ext.rouges}</span>

        ${m.termine && m.notes && moi ? `<h3 style="margin-top:1rem">Notes de vos joueurs</h3><div class="defilable"><table class="tbl"><tbody>${[...moi.aJoue].sort((a,b)=>m.notes[b]-m.notes[a]).map(pid=>`<tr><td>${badgeNote(m.notes[pid])}</td><td><button class="lien-joueur" data-action="fiche" data-pid="${pid}">${echapper(nomJ(pid))}</button></td><td class="petit muet">${POSTES[joueur(pid).poste]}${m.marqueurs[pid]?` · ${m.marqueurs[pid]} essai(s)`:""}</td></tr>`).join("")}</tbody></table></div>` : ""}
        <h3 style="margin-top:1rem">Sur le terrain</h3><div class="grille grille-2" style="gap:.5rem">${[m.dom,m.ext].map(c=>`<table class="tbl"><tbody>${[...c.terrain].sort((a,b)=>a.num-b.num).map(o=>`<tr><td class="num">${o.num}</td><td>${echapper(nomJ(o.pid))}</td><td><span class="jauge ${c.fit[o.pid]<40?'faible':c.fit[o.pid]<70?'moyen':''}"><i style="width:${Math.round(c.fit[o.pid])}%"></i></span></td></tr>`).join("")}</tbody></table>`).join("")}</div></div></div>`;
}

function demarrerSimulation(){
  if(!matchCourant || matchCourant.termine || timerMatch) return;
  if(vitesseMatch===0){ const sansDec = matchCourant.sansDecisions; matchCourant.sansDecisions = true; while(!matchCourant.termine) jouerMinute(matchCourant); matchCourant.sansDecisions = sansDec; render(); return; }
  timerMatch = setInterval(()=>{ jouerMinute(matchCourant);
    if(matchCourant.decision){ clearInterval(timerMatch); timerMatch = null; render(); return; }
    const moi = [matchCourant.dom, matchCourant.ext].some(c=>c.id===state.clubId);
    if(matchCourant.minute===40 && moi){ ajouterFeed(matchCourant, "Mi-temps : vous pouvez changer de consigne et effectuer des remplacements avant de reprendre.", "info"); clearInterval(timerMatch); timerMatch = null; }
    render(); if(matchCourant.termine){ clearInterval(timerMatch); timerMatch = null; } }, vitesseMatch);
}
function pauseSimulation(){ if(timerMatch){ clearInterval(timerMatch); timerMatch = null; render(); } }
function lireOffre(pid){
  const s = document.querySelector(`input[data-salaire="${pid}"]`), d = document.querySelector(`select[data-duree="${pid}"]`);
  return { salaire: s ? Math.round(+s.value) : 0, duree: d ? +d.value : 2 };
}

    case "fiche-effectif": state.ficheJoueur = null; state.ecran = "effectif"; sauvegarder(); render(); break;
    case "negocier-fiche": state.ficheJoueur = null; state.ecran = "marche"; state.ongletMarche = "liste"; state.messageMarche = ouvrirNegociation(+el.dataset.pid); sauvegarder(); render(); break;
    case "precontrat-fiche": state.ficheJoueur = null; state.ecran = "marche"; state.ongletMarche = "recherche"; state.messageMarche = ouvrirPreContrat(+el.dataset.pid); sauvegarder(); render(); break;
    case "filtre-fil": state.filtreFil = el.dataset.f; render(); break;
    case "decision": resoudreDecision(el.dataset.choix); if(vitesseMatch!==0) demarrerSimulation(); render(); break;
    case "live-tac": { const c = matchCourant && [matchCourant.dom, matchCourant.ext].find(x=>x.id===state.clubId);
      if(c && c.tac!==el.dataset.val){ c.tac = el.dataset.val; state.feuille.tactique = el.dataset.val;
        ajouterFeed(matchCourant, `${c.nom} passe en « ${TACTIQUES[el.dataset.val].nom} ».`, "info"); sauvegarder(); render(); } break; }
    case "live-cons": { const c = matchCourant && [matchCourant.dom, matchCourant.ext].find(x=>x.id===state.clubId);
      if(c){ const cle = el.dataset.cle, v = el.dataset.val;

    case "ouvrir-tiroir": state.tiroirRemp = true; state.sortantSel = null; render(); break;

    case "offre-refuser": state.messageMarche = traiterOffreRecue(+el.dataset.pid, false); sauvegarder(); render(); break;

    case "centre-pro": state.messageMarche = passerPro(el.dataset.esp); sauvegarder(); render(); break;

    case "jouer": if(!state.licencie && !state.phase && jourDeMatchEnAttente() && !verifierFeuille(state.feuille, state.clubId).length) lancerMatchJoueur(); break;
    case "simuler-journee": if(!state.phase && !matchCourant && jourDeMatchEnAttente()) simulerJourneeComplete(); break;
    case "suivre-journee": if(!state.phase && !matchCourant && jourDeMatchEnAttente()) simulerJourneeComplete(); break;
    case "jouer-etape": if(state.phase && state.phase.etape!=="terminee" && !matchCourant && jourDeMatchEnAttente()) jouerEtape(); break;
    case "lancer": demarrerSimulation(); render(); break;
    case "pause": pauseSimulation(); break;

document.addEventListener("input", ev => { const el = ev.target; if(el.dataset && el.dataset.creation==="nom" && state.creation){ state.creation.nom = el.value; } if(el.dataset && el.dataset.filtre==="nom"){ state.filtreNom = el.value; } if(el.dataset && el.dataset.rech==="nom"){ state.recherche.nom = el.value; } });

/* Glisser-déposer sur la feuille de match */
let dragInfo = null;
document.addEventListener("dragstart", ev => { const el = ev.target.closest("[data-dragpid]"); if(!el) return; dragInfo = {pid:+el.dataset.dragpid, from:el.dataset.dragfrom||null}; ev.dataTransfer.effectAllowed = "move"; try{ ev.dataTransfer.setData("text/plain", String(dragInfo.pid)); }catch(e){} });
document.addEventListener("dragover", ev => { const el = ev.target.closest("[data-drop]"); if(el && dragInfo){ ev.preventDefault(); el.classList.add("survol"); } });
document.addEventListener("dragleave", ev => { const el = ev.target.closest("[data-drop]"); if(el) el.classList.remove("survol"); });
document.addEventListener("drop", ev => {
  const el = ev.target.closest("[data-drop]"); if(!el || !dragInfo) return; ev.preventDefault();
  const lire = cle => { const [t,i] = cle.split("-"); return {liste: t==="t" ? state.feuille.titulaires : state.feuille.banc, i:+i}; };
  const dest = lire(el.dataset.drop); const occupant = dest.liste[dest.i];
  for(const l of [state.feuille.titulaires, state.feuille.banc]) l.forEach((v,k)=>{ if(v===dragInfo.pid) l[k] = null; });
  dest.liste[dest.i] = dragInfo.pid;
  if(dragInfo.from && occupant && occupant!==dragInfo.pid){ const src = lire(dragInfo.from); src.liste[src.i] = occupant; }
  dragInfo = null; state.slotSel = null; completerSpecialistes(state.feuille); sauvegarder(); render();
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.centre==="budget"){ const cf = obtenirCentre(club()); const v = +el.value;
    cf.budgetInvestissement = CENTRE_INVESTISSEMENTS.includes(v) ? v : CENTRE_BUDGET_DEFAUT;
    state.messageMarche = {ok:true, texte:`Investissement du centre de formation fixé à ${cf.budgetInvestissement.toFixed(2)} M€/an.`}; sauvegarder(); render(); return; }
  if(el.dataset.rech){ const k = el.dataset.rech;
    state.recherche[k] = (k==="finContrat") ? el.value==="1" : (["ageMax","nivMin","salMax"].includes(k) ? (+el.value||0) : el.value);
    sauvegarder(); render(); return; }
  if(el.dataset.filtre==="poste"){ state.filtrePoste = el.value; render(); return; }
  if(el.dataset.filtre==="nom"){ state.filtreNom = el.value; render(); return; }
  if(el.dataset.spec){ const f = normaliserFeuille(state.feuille); f.specialistes[el.dataset.spec] = el.value ? +el.value : null; sauvegarder(); render(); return; }
  if(el.dataset.bomb){ const f = normaliserFeuille(state.feuille); const id = +el.dataset.bomb;
    const liste = f.specialistes.bombSquad;
    if(el.checked){ if(!liste.includes(id) && liste.length<4) liste.push(id); }
    else f.specialistes.bombSquad = liste.filter(x=>x!==id);
    sauvegarder(); render(); return; }
  if(el.dataset.schema){ const f = normaliserFeuille(state.feuille); f.schemas[el.dataset.schema] = el.value; sauvegarder(); render(); return; }
  if(el.dataset.auto){ const f = normaliserFeuille(state.feuille); const k = el.dataset.auto;
    f.auto[k] = (k==="actif"||k==="bombGroupee") ? el.value==="1" : (k==="bombMinute" ? +el.value : el.value);
    sauvegarder(); render(); return; }
  if(el.dataset.semaine){ state.semaine = {...(state.semaine||SEMAINE_DEFAUT), [el.dataset.semaine]: el.value}; sauvegarder(); render(); return; }
  if(el.dataset.consigne){ const cote = matchCourant && [matchCourant.dom, matchCourant.ext].find(c=>c.id===state.clubId);
    if(cote){ cote.cons = {...(cote.cons||CONSIGNES_DEFAUT), [el.dataset.consigne]: el.value};
      state.consignes = {...(state.consignes||CONSIGNES_DEFAUT), [el.dataset.consigne]: el.value};
      ajouterFeed(matchCourant, `${cote.nom} — nouvelle consigne : ${CONSIGNES[el.dataset.consigne].options[el.value].lib}.`, "info");
      sauvegarder(); render(); } return; }
  if(el.dataset.consigneClub){ state.consignes = {...(state.consignes||CONSIGNES_DEFAUT), [el.dataset.consigneClub]: el.value}; sauvegarder(); render(); return; }
  if(el.dataset.actionChange==="tactique-match"){ const cote = matchCourant && [matchCourant.dom, matchCourant.ext].find(c=>c.id===state.clubId); if(cote){ cote.tac = el.value; ajouterFeed(matchCourant, `${cote.nom} passe en « ${TACTIQUES[el.value].nom} ».`, "info"); render(); } return; }
  if(el.dataset.actionChange==="editeur-club"){ state.editeurClub = el.value; state.messageMarche = null; render(); return; }
  if(el.dataset.edit){
    const [pid, champ] = el.dataset.edit.split("|"); const p = joueur(+pid); if(!p) return;
    if(champ==="nom"){ p.nom = el.value.trim() || p.nom; }
    else if(champ==="poste"){ p.poste = el.value; if(p.poste2===p.poste) p.poste2 = null; }
    else if(champ==="poste2"){ p.poste2 = el.value && el.value!==p.poste ? el.value : null; }
    else if(champ==="age"){ p.age = clamp(Math.round(+el.value)||24, 17, 45); }
    else if(champ==="jiff"){ p.jiff = el.checked; }
    else if(champ==="salaire"){ p.salaire = Math.max(30, Math.round(+el.value)||p.salaire); }
    else if(champ.startsWith("attr.")){ p.attr[champ.slice(5)] = clamp(Math.round(+el.value)||10, 1, 20); }
    else if(champ==="clubId" && el.value!==p.clubId && state.equipes[el.value]){ const anc = state.equipes[p.clubId]; anc.joueurs = anc.joueurs.filter(x=>x!==p); p.clubId = el.value; p.listeTransfert = false; state.equipes[el.value].joueurs.push(p); }
    nettoyerFeuille(); state.messageMarche = null; state.exportDB = null; sauvegarder(); render(); return;
  }
  if(el.name==="tactique"){ state.feuille.tactique = el.value; sauvegarder(); render(); return; }
  if(!el.dataset.slot) return;
  const [type, idx] = el.dataset.slot.split("-"); const i = +idx; const liste = type==="t" ? state.feuille.titulaires : state.feuille.banc;
  const id = el.value ? +el.value : null;
  if(id) for(const l of [state.feuille.titulaires, state.feuille.banc]) l.forEach((v,k)=>{ if(v===id) l[k] = null; });
  liste[i] = id; completerSpecialistes(state.feuille); sauvegarder(); render();
});

(function demarrer(){
  const s = charger();
  if(s && s.clubId && s.equipes && s.calendrier){ state = s; reconstruireIndex(); if(state.ecran==="match") state.ecran = "dashboard"; state.messageMarche = null; }
  else state = {clubId:null, theme:"sombre"};
  state.vue = "menu";                                   // on arrive toujours par le menu principal
  if(!state.manager && state.clubId) state.manager = {nom:"Manager", reputation:55, carriere:[], offres:[]};
  if(state.clubId && !state.capitaine) state.capitaine = capitaineAuto();
  if(state.clubId && !state.semaine) state.semaine = {...SEMAINE_DEFAUT};
  if(state.clubId && state.feuille) completerSpecialistes(state.feuille);
  render();
})();
</script>
