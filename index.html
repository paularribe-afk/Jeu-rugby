<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugby Manager — Top 14 (v19)</title>
<style>
/* =====================================================================
   RUGBY MANAGER — FEUILLE DE STYLE v17
   Direction artistique « Pitch Night » : habillage de régie télé,
   verre dépoli discret, profondeur douce, accents aux couleurs du club.
   ===================================================================== */
:root{
  --fond:#0a0e17; --fond-2:#121824; --surface:#182234; --surface-2:#1e2a3f; --surface-3:#243350;
  --ligne:rgba(255,255,255,.08); --ligne-forte:rgba(255,255,255,.16);
  --texte:#eef2f8; --texte-2:#8d9cb5; --texte-3:#5f6f8a;
  --accent:#d9a648; --club:#d9a648; --club-texte:#0a0e17;
  --ok:#3ddc84; --alerte:#ff5a4d; --jaune:#ffd23f; --bleu:#3d8bfd;
  --rayon:14px; --rayon-s:9px;
  --ombre:0 10px 34px rgba(0,0,0,.45); --ombre-s:0 3px 12px rgba(0,0,0,.32);
  --verre:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  --sidebar:232px;
}
:root[data-theme="clair"]{
  --fond:#eef1f7; --fond-2:#e6eaf2; --surface:#ffffff; --surface-2:#f4f7fc; --surface-3:#e9eef7;
  --ligne:rgba(12,20,36,.1); --ligne-forte:rgba(12,20,36,.2);
  --texte:#101827; --texte-2:#5a6a85; --texte-3:#8494ad;
  --ombre:0 10px 30px rgba(18,28,48,.14); --ombre-s:0 2px 8px rgba(18,28,48,.1);
  --verre:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.65));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-size:14.5px;line-height:1.5;
  font-family:Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 12% -10%,rgba(61,139,253,.09),transparent 60%),
             radial-gradient(900px 480px at 100% 0%,color-mix(in srgb,var(--club) 16%,transparent),transparent 62%)}
h1,h2,h3{margin:0 0 .55rem;letter-spacing:-.015em;font-weight:700}
h1{font-size:1.4rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--texte-2);font-weight:700}
h3{font-size:.92rem;color:var(--texte-2);font-weight:600}
p{margin:0 0 .55rem}
button{font:inherit;cursor:pointer}
select,input[type=number],input[type=text],textarea{font:inherit;background:var(--surface-2);color:var(--texte);
  border:1px solid var(--ligne);border-radius:var(--rayon-s);padding:.42rem .6rem;max-width:100%;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover{border-color:var(--ligne-forte)}
select:focus,input:focus,button:focus-visible{outline:none;border-color:var(--club);box-shadow:0 0 0 3px color-mix(in srgb,var(--club) 28%,transparent)}

/* ---------- Structure ---------- */
.layout{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:linear-gradient(180deg,var(--fond-2),var(--fond));
  border-right:1px solid var(--ligne);padding:.85rem .65rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.15rem}
.sidebar .club-bloc{display:flex;align-items:center;gap:.65rem;padding:.35rem .5rem .9rem;border-bottom:1px solid var(--ligne);margin-bottom:.6rem}
.sidebar .ecusson{display:grid;place-items:center}
.sidebar .club-nom{font-weight:700;font-size:.92rem;line-height:1.15}
.sidebar .club-sous{font-size:.72rem;color:var(--texte-2);margin-top:.1rem}
.sidebar button.nav-item{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;background:transparent;
  color:var(--texte-2);border:0;border-radius:10px;padding:.55rem .65rem;font-weight:600;font-size:.88rem;position:relative;transition:background .15s,color .15s}
.sidebar button.nav-item .ico{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;opacity:.85}
.sidebar button.nav-item .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sidebar button.nav-item:hover{background:var(--surface);color:var(--texte)}
.sidebar button.nav-item.actif{background:linear-gradient(90deg,color-mix(in srgb,var(--club) 22%,transparent),transparent 78%);color:var(--texte)}
.sidebar button.nav-item.actif::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;
  background:var(--club);box-shadow:0 0 12px var(--club)}
.sidebar button.nav-item.actif .ico{opacity:1;color:var(--club)}
.sidebar .bas{margin-top:auto;display:grid;gap:.35rem;padding-top:.6rem;border-top:1px solid var(--ligne)}
.contenu{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- Bannière de régie ---------- */
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:1rem;padding:.55rem 1.1rem;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fond-2) 94%,transparent),color-mix(in srgb,var(--fond) 92%,transparent));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--ligne);box-shadow:0 1px 0 color-mix(in srgb,var(--club) 55%,transparent),0 8px 22px rgba(0,0,0,.28)}
header .titre{font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
header .meta{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--texte-2)}
header .meta .bloc-meta{display:grid;gap:.15rem;min-width:96px}
header .meta .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--texte-3);font-weight:700}
header .meta .vl{font-size:.92rem;font-weight:800;color:var(--texte);line-height:1}
header .droite{margin-left:auto;display:flex;gap:.5rem;align-items:center}
header .menu{display:none}
.jauge-fine{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;min-width:96px}
.jauge-fine i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
main{max-width:1280px;width:100%;margin:0 auto;padding:1.1rem}
.tabbar{display:none}

/* ---------- Cartes & widgets ---------- */
.carte{background:var(--surface);background-image:var(--verre);border:1px solid var(--ligne);border-radius:var(--rayon);
  padding:1rem 1.05rem;margin-bottom:.9rem;box-shadow:var(--ombre-s)}
.grille{display:grid;gap:.9rem}
.grille-2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.grille-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:.75rem;margin-bottom:.9rem}
.kpi-carte{position:relative;overflow:hidden;background:var(--surface);background-image:var(--verre);
  border:1px solid var(--ligne);border-radius:var(--rayon);padding:.75rem .9rem;box-shadow:var(--ombre-s)}
.kpi-carte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--club);
  box-shadow:0 0 14px color-mix(in srgb,var(--club) 70%,transparent)}
.kpi-carte .lib{font-size:.63rem;text-transform:uppercase;letter-spacing:.12em;color:var(--texte-3);font-weight:700}
.kpi-carte .val{font-size:1.75rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-top:.1rem}
.kpi-carte .sous{font-size:.74rem;color:var(--texte-2);margin-top:.15rem}
.kpi-carte .anneau{position:absolute;right:.7rem;top:.7rem}
.kpi{font-size:1.5rem;font-weight:800;color:var(--club)}
.muet{color:var(--texte-2)} .petit{font-size:.82rem}
.forme-serie{display:inline-flex;gap:.22rem}
.forme-serie span{display:inline-grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:7px;font-size:.72rem;
  font-weight:800;color:#07110b;box-shadow:var(--ombre-s)}
.forme-serie .V{background:linear-gradient(160deg,#5ef0a0,var(--ok))}
.forme-serie .N{background:linear-gradient(160deg,#b9c6da,#8d9cb5);color:#0d1420}
.forme-serie .D{background:linear-gradient(160deg,#ff8175,var(--alerte));color:#1a0705}

/* ---------- Boutons & badges ---------- */
.btn{background:var(--surface-2);color:var(--texte);border:1px solid var(--ligne);border-radius:10px;
  padding:.5rem .95rem;font-weight:650;transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:var(--ligne-forte);background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn-primaire{background:linear-gradient(160deg,color-mix(in srgb,var(--club) 92%,#fff),var(--club));color:var(--club-texte);
  border-color:transparent;box-shadow:0 4px 18px color-mix(in srgb,var(--club) 34%,transparent)}
.btn-primaire:hover{filter:brightness(1.07)}
.btn-continuer{background:linear-gradient(160deg,#5ef0a0,var(--ok));color:#052012;border-color:transparent;
  font-weight:800;padding:.5rem 1.15rem;box-shadow:0 4px 18px rgba(61,220,132,.3)}
.btn-petit{padding:.28rem .6rem;font-size:.79rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.65rem;align-items:center}
.onglets{display:flex;gap:.2rem;flex-wrap:wrap;margin-bottom:.85rem;border-bottom:1px solid var(--ligne)}
.onglets button{background:transparent;color:var(--texte-2);border:0;border-bottom:2px solid transparent;
  padding:.5rem .85rem;font-weight:650;font-size:.87rem;transition:color .15s,border-color .15s}
.onglets button:hover{color:var(--texte)}
.onglets button.actif{color:var(--texte);border-bottom-color:var(--club)}
.badge{display:inline-block;padding:.12rem .45rem;border-radius:6px;font-size:.7rem;font-weight:800;line-height:1.5;
  white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.badge-jiff{background:rgba(61,220,132,.16);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(61,220,132,.25)}
.badge-non{background:rgba(141,156,181,.14);color:var(--texte-2)}
.badge-blesse{background:rgba(255,90,77,.16);color:var(--alerte);box-shadow:inset 0 0 0 1px rgba(255,90,77,.25)}
.badge-ok{background:rgba(61,220,132,.16);color:var(--ok)}
.badge-alerte{background:rgba(255,90,77,.16);color:var(--alerte)}
.badge-liste{background:rgba(255,210,63,.16);color:var(--jaune)}
.badge-perso{background:rgba(255,255,255,.07);color:var(--texte-2)}
.badge-forme-club{background:rgba(61,220,132,.14);color:var(--ok)}
.badge-capitaine{background:var(--club);color:var(--club-texte);box-shadow:0 0 12px color-mix(in srgb,var(--club) 45%,transparent)}
.lien-joueur{background:none;border:0;color:var(--texte);font:inherit;font-weight:650;padding:0;text-align:left;cursor:pointer;
  border-bottom:1px dotted var(--texte-3);transition:color .15s,border-color .15s}
.lien-joueur:hover{color:var(--club);border-color:var(--club)}

/* ---------- Tableaux ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem}
.tbl th,.tbl td{padding:.42rem .5rem;text-align:left;border-bottom:1px solid var(--ligne);white-space:nowrap}
.tbl th{background:var(--surface-2);color:var(--texte-3);font-weight:800;position:sticky;top:0;z-index:1;
  font-size:.66rem;text-transform:uppercase;letter-spacing:.1em}
.tbl th.triable{cursor:pointer;user-select:none}.tbl th.triable:hover{color:var(--texte)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:rgba(255,255,255,.035)}
.tbl td.num{text-align:right}.tbl .moy{font-weight:800;color:var(--club)}
.defilable{overflow-x:auto;border-radius:var(--rayon-s)}
.tbl.fige th:first-child,.tbl.fige td:first-child{position:sticky;left:0;background:var(--surface);z-index:2}
.classement tr.moi td{background:color-mix(in srgb,var(--club) 12%,transparent)}
.classement tr.qualif td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.classement tr.barrage td:first-child{box-shadow:inset 3px 0 0 var(--jaune)}
.classement tr.maintien td:first-child{box-shadow:inset 3px 0 0 #ff9f43}
.classement tr.relegation td:first-child{box-shadow:inset 3px 0 0 var(--alerte)}
.filtres{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.65rem}
.jauge{display:inline-block;width:62px;height:7px;background:var(--surface-3);border-radius:4px;vertical-align:middle;overflow:hidden}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,#5ef0a0,var(--ok));transition:width .4s}
.jauge.moyen i{background:linear-gradient(90deg,#ffe27a,var(--jaune))}
.jauge.faible i{background:linear-gradient(90deg,#ff8175,var(--alerte))}
.n-haut{color:var(--ok);font-weight:700}.n-bas{color:var(--alerte)}
.note-joueur{display:inline-grid;place-items:center;min-width:2.15rem;padding:.08rem .35rem;border-radius:7px;
  font-weight:800;font-size:.79rem;color:#07110b;box-shadow:var(--ombre-s)}
.note-joueur.exc{background:linear-gradient(160deg,#5ef0a0,#23b566)}
.note-joueur.bon{background:linear-gradient(160deg,#a9e9b8,#63c98a)}
.note-joueur.moy{background:linear-gradient(160deg,#ffe27a,#d9b43f)}
.note-joueur.fai{background:linear-gradient(160deg,#ffb27a,#e08a4a)}
.note-joueur.mau{background:linear-gradient(160deg,#ff8f82,#d9544a);color:#1a0705}

/* ---------- Formulaires & messages ---------- */
.tactique-choix{display:grid;gap:.5rem}
.tactique-choix label{display:block;border:1px solid var(--ligne);border-radius:var(--rayon-s);padding:.65rem .85rem;cursor:pointer;transition:border-color .15s,background .15s}
.tactique-choix label:hover{border-color:var(--ligne-forte)}
.tactique-choix label.actif{border-color:var(--club);background:color-mix(in srgb,var(--club) 9%,transparent)}
.tactique-choix input{margin-right:.5rem}
.compteur{font-size:1.5rem;font-weight:800}.compteur.ok{color:var(--ok)}.compteur.ko{color:var(--alerte)}
ul.erreurs{margin:.45rem 0 0;padding-left:1.15rem;color:var(--alerte)}
.message{border-left:3px solid var(--club);background:rgba(255,255,255,.035);padding:.55rem .75rem;border-radius:var(--rayon-s);margin:.5rem 0}
.message.erreur{border-color:var(--alerte)}.message.ok{border-color:var(--ok)}
.offre{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.35rem}.offre input{width:7rem}
.jauge-interet,.jauge-conf{height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden;margin:.3rem 0}
.jauge-interet i,.jauge-conf i{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.jauge-interet i{background:linear-gradient(90deg,var(--alerte),var(--jaune),var(--ok))}
.nego-hist{font-size:.84rem;border-left:2px solid var(--ligne);padding-left:.6rem;margin:.5rem 0}
.consignes,.semaine,.recherche-filtres{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:.5rem}
.consignes label,.semaine label,.recherche-filtres label{display:grid;gap:.2rem;font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texte-3);font-weight:700}
.consignes select,.semaine select,.recherche-filtres input,.recherche-filtres select{width:100%}
.effet-consigne{font-size:.79rem;color:var(--texte-2);margin-top:.45rem}
.toasts{position:fixed;right:1rem;bottom:4.6rem;z-index:60;display:grid;gap:.5rem;max-width:min(430px,92vw)}
.toast{background:var(--surface);background-image:var(--verre);border:1px solid var(--ligne);border-left:4px solid var(--club);
  border-radius:12px;padding:.65rem .85rem;box-shadow:var(--ombre);font-size:.87rem;animation:toast-in .28s cubic-bezier(.2,.8,.3,1)}
.toast.ok{border-left-color:var(--ok)}.toast.erreur{border-left-color:var(--alerte)}
@keyframes toast-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- Modales ---------- */
.voile{position:fixed;inset:0;background:rgba(5,9,16,.72);backdrop-filter:blur(5px);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:2rem .8rem;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modale{background:var(--surface);background-image:var(--verre);border:1px solid var(--ligne-forte);border-radius:18px;
  box-shadow:var(--ombre);width:min(780px,100%);padding:1.1rem 1.2rem;animation:pop .25s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modale .entete-fiche{display:flex;gap:1rem;align-items:center;border-bottom:1px solid var(--ligne);padding-bottom:.75rem;margin-bottom:.75rem}
.modale .numero-fiche{width:54px;height:54px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--club) 90%,#fff),var(--club));
  color:var(--club-texte);display:grid;place-items:center;font-weight:800;font-size:1.15rem;box-shadow:0 6px 20px color-mix(in srgb,var(--club) 35%,transparent)}
.radar{width:100%;max-width:290px;margin:0 auto;display:block}
.radar .grille-radar{fill:none;stroke:var(--ligne-forte)}
.radar .aire{fill:var(--club);fill-opacity:.32;stroke:var(--club);stroke-width:2.2;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--club) 45%,transparent))}
.radar text{fill:var(--texte-2);font-size:9px;font-weight:600}
.fiche-infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:.5rem .85rem;font-size:.87rem}
.fiche-infos b{display:block;color:var(--texte-3);font-weight:700;font-size:.63rem;text-transform:uppercase;letter-spacing:.11em}

/* ---------- MATCHDAY LIVE ---------- */
.scoreboard{border-radius:18px;overflow:hidden;border:1px solid var(--ligne-forte);margin-bottom:.9rem;box-shadow:var(--ombre);
  background:linear-gradient(180deg,#0d1421,#0a0e17)}
:root[data-theme="clair"] .scoreboard{background:linear-gradient(180deg,#1b2537,#131c2b)}
.scoreboard .bandeau{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;position:relative}
.scoreboard .bandeau::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--eq-dom,#888) 22%,transparent),transparent 34%,transparent 66%,color-mix(in srgb,var(--eq-ext,#888) 22%,transparent))}
.scoreboard .eq{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.1rem;font-weight:800;font-size:1.02rem;color:#f3f7fd;position:relative;z-index:1}
.scoreboard .eq.ext{justify-content:flex-end;text-align:right}
.scoreboard .eq .detail{display:block;font-size:.7rem;color:#93a4bd;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-top:.12rem}
.scoreboard .score{display:grid;place-items:center;min-width:186px;padding:.35rem 1.1rem;position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.2));border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}
.scoreboard .score .chiffres{font-size:2.7rem;font-weight:900;letter-spacing:.02em;color:#fff;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,.6)}
.scoreboard .score .chiffres.pulse{animation:score-pulse .75s cubic-bezier(.2,.8,.3,1)}
@keyframes score-pulse{0%{transform:scale(1)}30%{transform:scale(1.18);text-shadow:0 0 28px var(--club)}100%{transform:scale(1)}}
.scoreboard .chrono-bloc{display:flex;align-items:center;gap:.5rem;margin-top:.3rem}
.scoreboard .chrono{font-size:1.02rem;font-weight:800;color:#fff;letter-spacing:.06em;padding:.06rem .5rem;border-radius:6px;
  background:rgba(255,255,255,.1)}
.scoreboard .chrono.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alerte);
  margin-right:.4rem;vertical-align:middle;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.scoreboard .periode{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:#93a4bd;font-weight:700}
.possession{height:9px;display:flex;overflow:hidden;background:#0a0e17}
.possession i{display:block;height:100%;transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
.possession i::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent)}
.scoreboard .sous-bandeau{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.4rem 1rem;
  background:rgba(255,255,255,.04);font-size:.76rem;color:#93a4bd;font-weight:600}
.scoreboard .sous-bandeau .pos-val{color:#e7eefb;font-weight:800}

/* Mini-stade vu de dessus */
.stade{position:relative;height:132px;background:#1c6b3a;overflow:hidden;border-top:1px solid rgba(255,255,255,.1)}
.stade .pelouse{position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#1e7440 0 7.14%,#1a6739 7.14% 14.28%)}
.stade .lueur{position:absolute;inset:0;background:radial-gradient(70% 120% at 50% -20%,rgba(255,255,255,.16),transparent 60%)}
.stade .lgn{position:absolute;top:8%;bottom:8%;width:2px;background:rgba(255,255,255,.55)}
.stade .lgn.pointille{background:repeating-linear-gradient(180deg,rgba(255,255,255,.6) 0 7px,transparent 7px 14px);width:2px}
.stade .lgn.mediane{background:rgba(255,255,255,.8);width:3px}
.stade .enbut-z{position:absolute;top:0;bottom:0;width:8%;background:rgba(0,0,0,.28)}
.stade .enbut-z.g{left:0;border-right:2px solid rgba(255,255,255,.75)}
.stade .enbut-z.d{right:0;border-left:2px solid rgba(255,255,255,.75)}
.stade .poteau{position:absolute;top:50%;transform:translateY(-50%);width:16px;height:46px}
.stade .poteau.g{left:5.4%}.stade .poteau.d{right:5.4%}
.stade .poteau i{position:absolute;background:rgba(255,255,255,.9);border-radius:2px}
.stade .poteau i.v{width:3px;height:100%;top:0}.stade .poteau i.v1{left:0}.stade .poteau i.v2{right:0}
.stade .poteau i.h{height:3px;left:0;right:0;top:34%}
.stade .nom-zone{position:absolute;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:.56rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:800;white-space:nowrap}
.stade .nom-zone.g{left:-.6rem}.stade .nom-zone.d{right:-.6rem}
.stade .marque-m{position:absolute;bottom:4px;font-size:.55rem;color:rgba(255,255,255,.55);font-weight:700;transform:translateX(-50%)}
.stade .ballon{position:absolute;top:50%;width:26px;height:17px;margin:-8.5px 0 0 -13px;border-radius:50%/42%;
  background:linear-gradient(160deg,#f6e2b4,var(--accent));border:1.5px solid rgba(60,40,8,.7);
  box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--accent) 55%,transparent);
  transition:left .45s cubic-bezier(.34,1.3,.5,1);z-index:3}
.stade .ballon::after{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:1.5px;background:rgba(60,40,8,.55);transform:translateX(-50%)}
.stade .halo{position:absolute;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--eq-actif,#fff) 40%,transparent),transparent 68%);
  transition:left .45s cubic-bezier(.34,1.3,.5,1);z-index:2}
.stade .phase{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:.66rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.11em;color:#fff;background:rgba(0,0,0,.5);padding:.12rem .6rem;border-radius:20px;
  backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);z-index:4;white-space:nowrap}
.sequence{font-size:.79rem;color:var(--texte-2);padding:.4rem .95rem;background:var(--surface-2);border-top:1px solid var(--ligne);
  display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.sequence strong{color:var(--texte)}

/* Frise des temps forts */
.timeline{position:relative;height:38px;background:var(--surface-2);border-top:1px solid var(--ligne)}
.timeline .mt{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--ligne-forte)}
.timeline .ev{position:absolute;width:21px;height:21px;border-radius:7px;transform:translateX(-50%);display:grid;place-items:center;
  font-size:.62rem;font-weight:900;color:#07110b;border:2px solid var(--surface-2);box-shadow:var(--ombre-s);cursor:default}
.timeline .ev.essai{background:linear-gradient(160deg,#5ef0a0,var(--ok))}
.timeline .ev.pen,.timeline .ev.drop{background:linear-gradient(160deg,#79b4ff,var(--bleu));color:#04122b}
.timeline .ev.jaune{background:linear-gradient(160deg,#ffe27a,var(--jaune))}
.timeline .ev.rouge{background:linear-gradient(160deg,#ff8175,var(--alerte));color:#1a0705}
.timeline .ev.haut{top:3px}.timeline .ev.bas{top:15px}

/* Ticker du match */
.fil{max-height:460px;overflow-y:auto;border:1px solid var(--ligne);border-radius:var(--rayon);background:var(--surface);
  background-image:var(--verre);box-shadow:var(--ombre-s)}
.evt{display:grid;grid-template-columns:3.1rem 1fr;gap:.7rem;padding:.5rem .8rem;border-bottom:1px solid var(--ligne);
  font-size:.87rem;position:relative;animation:evt-in .3s ease}
@keyframes evt-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.evt .min{color:var(--texte-3);text-align:right;font-weight:800;font-size:.78rem;padding-top:.05rem}
.evt.essai{background:linear-gradient(90deg,rgba(61,220,132,.2),transparent 70%);font-weight:750;
  box-shadow:inset 3px 0 0 var(--ok)}
.evt.essai .min{color:var(--ok)}
.evt.pen,.evt.drop{background:linear-gradient(90deg,rgba(61,139,253,.16),transparent 70%);box-shadow:inset 3px 0 0 var(--bleu)}
.evt.pen .min,.evt.drop .min{color:var(--bleu)}
.evt.jaune{background:linear-gradient(90deg,rgba(255,210,63,.18),transparent 70%);box-shadow:inset 3px 0 0 var(--jaune)}
.evt.rouge{background:linear-gradient(90deg,rgba(255,90,77,.22),transparent 70%);box-shadow:inset 3px 0 0 var(--alerte)}
.evt.blessure{background:linear-gradient(90deg,rgba(255,90,77,.1),transparent 70%)}
.evt.info{color:var(--texte-2);font-style:italic}
.stats-match{display:grid;grid-template-columns:1fr auto 1fr;gap:.45rem 1rem;font-size:.9rem;align-items:center}
.stats-match .d{text-align:right;font-weight:800}
.stats-match .l{color:var(--texte-3);text-align:center;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}

/* Alerte tactique */
.decision-voile{position:fixed;inset:0;background:rgba(4,8,14,.78);backdrop-filter:blur(6px);z-index:55;
  display:flex;align-items:center;justify-content:center;padding:1.2rem;animation:fade .2s}
.decision{width:min(560px,100%);background:linear-gradient(180deg,color-mix(in srgb,var(--club) 16%,var(--surface)),var(--surface));
  border:1px solid var(--club);border-radius:20px;padding:1.3rem 1.4rem;box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  animation:pop .3s cubic-bezier(.2,.8,.3,1)}
.decision .tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.64rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.16em;color:var(--club-texte);background:var(--club);padding:.2rem .6rem;border-radius:20px;margin-bottom:.6rem}
.decision h2{color:var(--texte);text-transform:none;letter-spacing:-.01em;font-size:1.3rem;margin-bottom:.35rem}
.decision .contexte{color:var(--texte-2);font-size:.92rem}
.decision .choix{display:grid;gap:.5rem;margin-top:1rem}
.decision .choix button{text-align:left;padding:.8rem 1rem;font-weight:700;font-size:.95rem;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--ligne-forte);color:var(--texte);transition:transform .12s,border-color .15s,background .15s}
.decision .choix button:hover{background:var(--surface-3);border-color:var(--club);transform:translateX(3px)}
.decision .choix button .sub{display:block;font-weight:600;font-size:.78rem;color:var(--texte-2);margin-top:.15rem}

/* ---------- Barre tactique de bord de touche ---------- */
.barre-tactique{display:grid;gap:.5rem;background:var(--surface);background-image:var(--verre);border:1px solid var(--ligne);
  border-radius:var(--rayon);padding:.6rem .75rem;margin-bottom:.9rem;box-shadow:var(--ombre-s)}
.barre-tactique .rangee{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.barre-tactique .lbl{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--texte-3);min-width:72px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--ligne);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--texte-2);font-size:.76rem;font-weight:700;padding:.3rem .6rem;
  border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--texte)}
.seg button.on{background:var(--club);color:var(--club-texte);box-shadow:0 2px 10px color-mix(in srgb,var(--club) 40%,transparent)}
.btn-remp{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem}
/* Tiroir de remplacement */
.tiroir-voile{position:fixed;inset:0;background:rgba(4,8,14,.66);backdrop-filter:blur(4px);z-index:56;animation:fade .18s}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);background-image:var(--verre);
  border-left:1px solid var(--ligne-forte);box-shadow:-18px 0 50px rgba(0,0,0,.5);z-index:57;display:flex;flex-direction:column;
  animation:slide-in .26s cubic-bezier(.2,.8,.3,1)}
@keyframes slide-in{from{transform:translateX(100%)}to{transform:none}}
.tiroir .tete{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;border-bottom:1px solid var(--ligne)}
.tiroir .corps{flex:1;overflow-y:auto;padding:.8rem 1rem 1.4rem}
.tiroir h3{margin:.8rem 0 .4rem}
.rangee-joueur{display:grid;grid-template-columns:2rem 1fr 74px auto;gap:.55rem;align-items:center;padding:.4rem .5rem;
  border:1px solid transparent;border-radius:10px;cursor:pointer;transition:background .13s,border-color .13s;width:100%;
  background:transparent;color:inherit;font:inherit;text-align:left}
.rangee-joueur:hover{background:var(--surface-2);border-color:var(--ligne)}
.rangee-joueur.sel{border-color:var(--club);background:color-mix(in srgb,var(--club) 12%,transparent)}
.rangee-joueur .maillot{display:grid;place-items:center;width:2rem;height:2rem;border-radius:8px;background:var(--surface-3);
  font-weight:900;font-size:.8rem;color:var(--club)}
.rangee-joueur .nrj{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.rangee-joueur .nrj i{display:block;height:100%;transition:width .4s}
.rangee-joueur .meta-j{font-size:.72rem;color:var(--texte-2)}
.badge-bomb{background:rgba(255,90,77,.18);color:var(--alerte)}
/* Alerte de l'adjoint */
.alerte-adjoint{display:flex;align-items:center;gap:.6rem;background:linear-gradient(90deg,rgba(255,210,63,.16),transparent);
  border:1px solid var(--jaune);border-radius:12px;padding:.55rem .8rem;margin-bottom:.7rem;font-size:.87rem;animation:evt-in .3s ease}
.alerte-adjoint .txt{flex:1}
/* ---------- Feuille de match ---------- */
.terrain{position:relative;width:100%;max-width:540px;aspect-ratio:3/4;margin:0 auto;border-radius:12px;overflow:hidden;
  border:2px solid rgba(255,255,255,.45);box-shadow:var(--ombre);
  background:repeating-linear-gradient(180deg,#1e7440 0 12.5%,#1a6739 12.5% 25%)}
.terrain::before,.terrain::after{content:"";position:absolute;left:0;right:0;border-top:2px dashed rgba(255,255,255,.45)}
.terrain::before{top:22%}.terrain::after{top:50%;border-top-style:solid;border-color:rgba(255,255,255,.7)}
.terrain .enbut{position:absolute;left:0;right:0;top:0;height:8%;background:rgba(0,0,0,.26);border-bottom:2px solid rgba(255,255,255,.7)}
.slotpitch{position:absolute;transform:translate(-50%,-50%);width:24%;min-width:68px;background:var(--surface);
  background-image:var(--verre);color:var(--texte);border:2px solid var(--ligne-forte);border-radius:10px;
  padding:.22rem .28rem .3rem;line-height:1.16;text-align:center;font-size:.7rem;box-shadow:var(--ombre-s);transition:transform .12s,border-color .15s}
.slotpitch:hover{transform:translate(-50%,-50%) scale(1.04)}
.slotpitch .num{display:block;font-weight:900;color:var(--club);font-size:.78rem}
.slotpitch .nom{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.slotpitch .note{display:block;font-size:.66rem;color:var(--texte-2)}
.slotpitch .jf{display:block;height:3px;background:var(--surface-3);border-radius:2px;margin-top:.2rem;overflow:hidden}
.slotpitch .jf i{display:block;height:100%;background:var(--ok)}
.slotpitch.vide{border-style:dashed;color:var(--texte-3);background:rgba(10,14,23,.78)}
.slotpitch.actif{border-color:var(--club);box-shadow:0 0 0 3px color-mix(in srgb,var(--club) 35%,transparent)}
.slotpitch.hors{border-color:var(--alerte)}
.slotpitch.bomb{border-color:var(--alerte);box-shadow:0 0 0 2px rgba(255,90,77,.25),var(--ombre-s)}
.slotpitch.survol{outline:3px solid var(--ok)}
.banc{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;max-width:540px;margin:.7rem auto 0}
.banc .slotpitch{position:static;transform:none;width:auto;min-width:0}
.banc .slotpitch:hover{transform:scale(1.04)}
.panneau .choix{display:grid;gap:.3rem;max-height:430px;overflow-y:auto}
.panneau .choix button{text-align:left;display:flex;justify-content:space-between;gap:.5rem;cursor:grab}

/* ---------- Divers écrans ---------- */
.resultats{display:grid;grid-template-columns:1fr auto 1fr;gap:.35rem .8rem;font-size:.89rem;align-items:center}
.resultats .d{text-align:right}.resultats .s{font-weight:800;color:var(--club);white-space:nowrap}.resultats .moi{color:var(--club)}
.resultats button.s{background:var(--surface-2);border:1px solid var(--ligne);border-radius:7px;padding:.12rem .55rem;transition:border-color .15s}
.resultats button.s:hover{border-color:var(--club)}
.bracket{display:grid;gap:.6rem}
.bracket .match{border:1px solid var(--ligne);border-radius:var(--rayon-s);padding:.6rem .8rem;background:var(--surface-2)}
.prochain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.9rem;padding:.7rem 0}
.prochain .bloc{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.05rem}
.prochain .bloc.ext{justify-content:flex-end;text-align:right}
.prochain .carre{display:grid;place-items:center}
.prochain .vs{font-size:.66rem;color:var(--texte-3);text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.podium{display:grid;grid-template-columns:2rem 1fr auto;gap:.45rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--ligne);font-size:.87rem}
.podium .rg{color:var(--texte-3);text-align:right;font-weight:800}
.equipe-type{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.4rem}
.equipe-type .ligne-et{display:flex;gap:.4rem;align-items:center;background:var(--surface-2);border:1px solid var(--ligne);
  border-radius:9px;padding:.3rem .45rem;font-size:.79rem}
.equipe-type .n{font-weight:900;color:var(--club);min-width:1.2rem}
.carriere-ligne{display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--ligne)}
.offre-club,.offre-recue{border:1px solid var(--ligne);border-left:4px solid var(--club);border-radius:12px;padding:.75rem .9rem;
  margin-bottom:.6rem;background:var(--surface-2);display:flex;gap:.8rem;align-items:center}
.offre-recue{display:block;border-left-color:var(--jaune)}
.bandeau-licencie{background:linear-gradient(160deg,rgba(255,90,77,.18),var(--surface));border:1px solid var(--alerte);
  border-radius:var(--rayon);padding:1.2rem;text-align:center;margin-bottom:1rem}
.pastille-sous-contrat{font-size:.7rem;color:var(--texte-3)}
.etoile{background:none;border:0;cursor:pointer;color:var(--texte-3);font-size:1rem;padding:0 .2rem;transition:color .15s,transform .12s}
.etoile:hover{transform:scale(1.2)}.etoile.on{color:var(--jaune)}
.ecusson-svg{display:block;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.editeur td input[type=number]{width:3.6rem}.editeur td input[type=text]{width:11rem}
.editeur td select{padding:.2rem .3rem}.editeur th.att{color:var(--club)}
textarea.export{width:100%;min-height:220px;font:.78rem/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--surface-2);color:var(--texte);border:1px solid var(--ligne);border-radius:var(--rayon-s);padding:.6rem}

/* ---------- Menu principal ---------- */
.menu-ecran{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;position:relative;z-index:1;
  background:radial-gradient(1200px 620px at 50% -12%,rgba(61,220,132,.13),transparent 58%),
             radial-gradient(900px 500px at 50% 110%,rgba(61,139,253,.1),transparent 60%),
             linear-gradient(180deg,#0d1521,#070a10)}
.menu-boite{width:min(700px,100%);text-align:center}
.menu-titre{font-size:clamp(2.1rem,6.5vw,3.5rem);font-weight:900;letter-spacing:-.03em;margin:0;color:#f4f8fd;
  text-shadow:0 4px 26px rgba(0,0,0,.65)}
.menu-titre span{color:var(--accent);text-shadow:0 0 34px color-mix(in srgb,var(--accent) 55%,transparent)}
.menu-sous{color:#8d9cb5;margin:.4rem 0 1.7rem;letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;font-weight:700}
.menu-actions{display:grid;gap:.6rem;max-width:390px;margin:0 auto}
.menu-actions button{padding:.9rem 1rem;font-size:1rem;font-weight:750;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.055);color:#eef3f9;backdrop-filter:blur(6px);transition:transform .14s,background .15s}
.menu-actions button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.menu-actions button.principal{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
  color:#150f03;border-color:transparent;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 34%,transparent)}
.menu-actions button:disabled{opacity:.3;cursor:not-allowed;transform:none}
.menu-reprise{display:flex;align-items:center;gap:.85rem;justify-content:center;margin:0 auto 1.3rem;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:.8rem 1rem;max-width:440px;
  backdrop-filter:blur(6px)}
.menu-reprise .txt{text-align:left;line-height:1.35}
.menu-palmares{margin-top:1.7rem;color:#8d9cb5;font-size:.84rem}
.menu-palmares .ligne{display:flex;justify-content:center;align-items:center;gap:.5rem;padding:.18rem 0}
.menu-pied{margin-top:1.5rem;font-size:.72rem;color:#54637c}
.etapes{display:flex;gap:.4rem;justify-content:center;margin-bottom:1.3rem;flex-wrap:wrap}
.etapes span{font-size:.7rem;text-transform:uppercase;letter-spacing:.11em;color:var(--texte-3);border-bottom:2px solid transparent;
  padding:.25rem .6rem;font-weight:800}
.etapes span.actif{color:var(--texte);border-bottom-color:var(--club)}
.grille-clubs{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(245px,1fr))}
.carte-club{display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);background-image:var(--verre);
  border:1px solid var(--ligne);border-radius:14px;padding:.8rem;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .14s,border-color .15s;box-shadow:var(--ombre-s)}
.carte-club:hover{border-color:var(--ligne-forte);transform:translateY(-2px)}
.carte-club.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent),var(--ombre-s)}
.carte-club .nom{font-weight:800;line-height:1.2}
.carte-club .det{font-size:.75rem;color:var(--texte-2);margin-top:.15rem}
.etoiles{color:var(--jaune);letter-spacing:.1em;font-size:.82rem;margin-top:.2rem}
.champ-nom{font-size:1.05rem;padding:.65rem .85rem;width:min(350px,100%)}
.choix-club{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.choix-club .carte{cursor:pointer;border-top:3px solid var(--accent);margin:0}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
    z-index:40;box-shadow:var(--ombre);height:100vh}
  .sidebar.ouvert{transform:none}
  header .menu{display:inline-flex}
  header .meta{gap:.7rem;font-size:.74rem}
  header .meta .bloc-meta{min-width:76px}
  main{padding:.8rem .8rem 5rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:color-mix(in srgb,var(--fond-2) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--ligne);
    padding:.3rem 0 max(.3rem,env(safe-area-inset-bottom))}
  .tabbar button{background:transparent;border:0;color:var(--texte-3);font-size:.64rem;display:grid;justify-items:center;
    gap:.15rem;padding:.35rem 0;font-weight:700;transition:color .15s}
  .tabbar button .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.actif{color:var(--club)}
  .scoreboard .score{min-width:124px;padding:.3rem .6rem}
  .scoreboard .score .chiffres{font-size:2rem}
  .scoreboard .eq{font-size:.86rem;padding:.65rem .7rem;gap:.45rem}
  .stade{height:104px}
  .decision{padding:1.1rem}

const CLE_SAUVEGARDE = "rugbyManagerTop14_v18";
let state = null, INDEX = {}, matchCourant = null, timerMatch = null, vitesseMatch = 400;
let prochainId = 1;

/** Fabrique un joueur complet à partir d'une ligne compacte. */
function creerJoueur(ligne, clubId, idx){
  const [nom, poste, poste2, age, jiff, niv, sal, forces] = ligne;
  const attr = {};
  for(const [k] of ATTRIBUTS){
    let v = niv + PROFILS[poste][k] + bruit(nom + k);      // niveau + profil du poste + petite variation
    if(forces && forces[k] !== undefined) v = forces[k];
    attr[k] = clamp(Math.round(v), 1, 20);
  }
  return { id: prochainId++, nom, poste, poste2: poste2 || null, age, jiff: jiff===1, attr,
    salaire: sal || salaireIndicatif(niv), forme:100, blessure:0, clubId,
    potentiel: clamp(niv + (age<=21 ? 4 : age<=23 ? 3 : age<=26 ? 1 : 0), 1, 20),   // plafond de progression
    perso: LISTE_PERSOS[((prochainId*2654435761)>>>0) % LISTE_PERSOS.length],        // trait de caractère
    formeAuClub: (((prochainId*40503)>>>0) % 100) < (jiff===1 ? 45 : 5),             // passé par le centre de formation du club
    records: {meilleureNote:0, essaisSaison:0, matchsTotal:0},
    contrat:{anneesRestantes: 1 + ((idx||0) % 3)}, listeTransfert:false,
    stats:{matchs:0, essais:0, points:0, sommeNotes:0} };
}
/** Variation déterministe -1/0/+1 dérivée du nom (pas d'aléa au rechargement). */
function bruit(s){ let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) & 0xffff; return (h % 3) - 1; }
function salaireIndicatif(niv){ return Math.round(60 + Math.pow(Math.max(0, niv-8), 2) * 9); }

function hydraterEquipes(){
  const equipes = {};
  for(const e of DB.equipes){
    equipes[e.id] = { id:e.id, nom:e.nom, court:e.court, ville:e.ville, stade:e.stade, couleur:e.couleur, budget:e.budget, reputation:e.reputation,
      joueurs: e.joueurs.map((l,i) => creerJoueur(l, e.id, i)),
      centreFormation: centreFormationDefaut() };
  }
  // Finaliste de Pro D2 (adversaire du match d'accession) : effectif générique de niveau modeste
  const prod2 = { id:"PROD2", nom:"Finaliste Pro D2", court:"Pro D2", ville:"—", stade:"Stade neutre", couleur:"#666", budget:0, reputation:55, horsChampionnat:true, joueurs:[] };
  const postesProD2 = [...POSTE_PAR_NUMERO, ...POSTES_BANC];
  postesProD2.forEach((po,i) => prod2.joueurs.push(creerJoueur([`Joueur Pro D2 n°${i+1}`, po, "", 24 + (i%8), 1, 10 + (i%3)], "PROD2", i)));
  equipes.PROD2 = prod2;
  return equipes;
}

function genererCalendrier(ids){
  const n = ids.length; const fixe = ids[0]; let rot = ids.slice(1); const aller = [];
  for(let r=0; r<n-1; r++){
    const ordre = [fixe, ...rot]; const matchs = [];
    for(let i=0; i<n/2; i++){
      let a = ordre[i], b = ordre[n-1-i];
      if((r+i)%2===1) [a,b] = [b,a];

/** Presse et vie du club : commentaires après les matchs, humeurs de joueurs, rendez-vous à venir. */

function verifierFeuille(f, clubId){
  const erreurs = []; const tous = [...f.titulaires, ...f.banc];
  const vides = tous.filter(id => !id).length;
  if(vides) erreurs.push(`${vides} place(s) non pourvue(s) sur la feuille de 23.`);
  if(tous.some((id,i) => id && tous.indexOf(id)!==i)) erreurs.push("Un joueur figure deux fois sur la feuille.");
  const etrangers = tous.filter(id => id && joueur(id).clubId!==clubId);
  if(etrangers.length) erreurs.push("Un joueur de la feuille ne fait plus partie du club.");
  const blesses = tous.filter(id => id && joueur(id).blessure>0).map(id=>joueur(id).nom);
  if(blesses.length) erreurs.push("Blessé(s) sélectionné(s) : " + blesses.join(", ") + ".");
  const nb = compterJiff(f);
  if(nb < JIFF_PLANCHER) erreurs.push(`Règle JIFF : ${nb} JIFF, plancher absolu de ${JIFF_PLANCHER} par feuille.`);
  else if(clubId===state.clubId && nb < MIN_JIFF){
    const proj = moyenneJiffProjetee(nb);
    if(proj < MIN_JIFF) erreurs.push(`Règle JIFF : avec ${nb} JIFF, votre moyenne saisonnière tomberait à ${proj.toFixed(2)} (objectif ${MIN_JIFF}).`);
  }
  return erreurs;
}

/** Garantit que la feuille possède ses sous-objets (anciennes sauvegardes incluses). */
function normaliserFeuille(f){
  f.specialistes = f.specialistes || {buteur1:null, buteur2:null, capitaineTouche:null, pilonneur:null, bombSquad:[]};
  if(!Array.isArray(f.specialistes.bombSquad)) f.specialistes.bombSquad = [];

  f.auto = {...AUTO_DEFAUT, ...(f.auto||{})};
  return f;
}
/** Complète les postes de spécialistes laissés vides, à partir des joueurs alignés. */
function completerSpecialistes(f){
  normaliserFeuille(f);
  const sur = [...f.titulaires, ...f.banc].filter(Boolean).map(joueur).filter(Boolean);
  const alignes = f.titulaires.filter(Boolean).map(joueur).filter(Boolean);
  const sp = f.specialistes;
  const valide = (id, liste) => id && liste.some(p=>p.id===id) ? id : null;
  sp.buteur1 = valide(sp.buteur1, sur); sp.buteur2 = valide(sp.buteur2, sur);
  sp.capitaineTouche = valide(sp.capitaineTouche, alignes); sp.pilonneur = valide(sp.pilonneur, alignes);
  const noteBotte = p => p.attr.pied*2 + p.attr.vis*0.5;
  if(!sp.buteur1){ const c = [...alignes].sort((a,b)=>noteBotte(b)-noteBotte(a))[0]; sp.buteur1 = c ? c.id : null; }
  if(!sp.buteur2){ const c = [...sur].filter(p=>p.id!==sp.buteur1).sort((a,b)=>noteBotte(b)-noteBotte(a))[0]; sp.buteur2 = c ? c.id : null; }
  if(!sp.capitaineTouche){ const cand = f.titulaires.map((id,i)=>({id,i})).filter(x=>x.id && [3,4,5,6,7].includes(x.i)).map(x=>joueur(x.id)).filter(Boolean);
    const c = cand.sort((a,b)=>(b.attr.vis+b.age*0.2)-(a.attr.vis+a.age*0.2))[0]; sp.capitaineTouche = c ? c.id : null; }
  if(!sp.pilonneur){ const cand = f.titulaires.slice(0,8).filter(Boolean).map(joueur).filter(Boolean);
    const c = cand.sort((a,b)=>b.attr.puis-a.attr.puis)[0]; sp.pilonneur = c ? c.id : null; }
  sp.bombSquad = sp.bombSquad.filter(id => f.banc.includes(id)).slice(0,4);
  return f;
}
/** Capitaine du club : influence le vestiaire et l'équipe sur le terrain. */
function capitaine(){ const id = state.capitaine; const p = id && joueur(id); return (p && p.clubId===state.clubId) ? p : null; }
/** Choisit automatiquement un capitaine crédible : leader, expérimenté, de bon niveau. */
function capitaineAuto(){
  const c = club();

/** Potentiel affiché : fourchette tant que le joueur n'a pas assez joué, valeur exacte ensuite. */

/** Moyenne saisonnière de JIFF sur vos feuilles, en incluant la feuille envisagée. */
function moyenneJiffProjetee(nb){ const h = state.jiffHist || []; return (h.reduce((a,b)=>a+b,0) + nb) / (h.length + 1); }
function moyenneJiffSaison(){ const h = state.jiffHist || []; return h.length ? h.reduce((a,b)=>a+b,0)/h.length : null; }
const nonJiff = e => e.joueurs.filter(p=>!p.jiff).length;
/** Fenêtres de mercato : intersaison (avant la J1 et après la finale) et fenêtre hivernale. */
function mercatoOuvert(){
  if(state.phase) return state.phase.etape==="terminee" ? {ouvert:true, libelle:"ouvert (intersaison)"} : {ouvert:false, libelle:"fermé pendant la phase finale"};
  const j = state.journee + 1;                                   // prochaine journée à jouer
  if(state.journee===0) return {ouvert:true, libelle:"ouvert (intersaison, jusqu'au coup d'envoi de la J1)"};

  return {ouvert:false, libelle:j<MERCATO_HIVER[0] ? `fermé, prochaine fenêtre à la J${MERCATO_HIVER[0]}` : "fermé jusqu'à la fin de saison"};

/** Composition automatique : meilleurs disponibles par poste, puis ajustement JIFF. */
function compositionAuto(equipeId){
  const e = state.equipes[equipeId];
  const valeur = p => moyenne(p) * (0.8 + 0.2*p.forme/100);
  const dispo = e.joueurs.filter(p => p.blessure===0).sort((a,b)=>valeur(b)-valeur(a));
  const pris = new Set();
  const prendre = poste => { const c = dispo.find(p=>p.poste===poste && !pris.has(p.id)) || dispo.find(p=>p.poste2===poste && !pris.has(p.id)) || dispo.find(p=>!pris.has(p.id)); if(c) pris.add(c.id); return c?c.id:null; };
  const feuille = { titulaires: POSTE_PAR_NUMERO.map(prendre), banc: POSTES_BANC.map(prendre),
    tactique: (state.feuille && equipeId===state.clubId) ? state.feuille.tactique : "equilibre",
    specialistes: (state.feuille && equipeId===state.clubId && state.feuille.specialistes) ? {...state.feuille.specialistes} : {buteur1:null, buteur2:null, capitaineTouche:null, pilonneur:null, bombSquad:[]},
    schemas: (state.feuille && equipeId===state.clubId && state.feuille.schemas) ? {...state.feuille.schemas} : {...SCHEMAS_DEFAUT},
    auto: (state.feuille && equipeId===state.clubId && state.feuille.auto) ? {...state.feuille.auto} : {...AUTO_DEFAUT} };
  const ajuster = liste => {
    for(let i=0;i<liste.length && compterJiff(feuille)<MIN_JIFF;i++){
      const actuel = liste[i]; if(!actuel || joueur(actuel).jiff) continue;

      if(cand){ pris.delete(actuel); pris.add(cand.id); liste[i] = cand.id; }
    }
  };
  ajuster(feuille.banc); ajuster(feuille.titulaires);
  return feuille;
}
function tactiqueIA(f){
  const ids = f.titulaires.filter(Boolean);

  const pied = Math.max(0, ...ids.map(id=>joueur(id).attr.pied));

function pointsClassement(pp, pc, ep, ec){

function creerMatch(domId, extId, fD, fE, tacD, tacE, contexte){
  const cote = (id, f, tac) => {
    const c = { id, nom:state.equipes[id].nom, tac,
      cons: id===state.clubId ? {...CONSIGNES_DEFAUT, ...(state.consignes||{})} : {...CONSIGNES_DEFAUT},
      capitaine: id===state.clubId ? state.capitaine : null,

      bomb: new Set((f.specialistes && f.specialistes.bombSquad) || []),
      entres: {},                                                    // minute d'entrée des remplaçants
      terrain: f.titulaires.map((pid,i)=>({pid,num:i+1})).filter(o=>o.pid),
      banc: f.banc.filter(Boolean).map(pid=>({pid})),
      fit:{}, prison:[], rouges:0, remplacements:0, aJoue:new Set(),
      score:0, essais:0, pens:0, drops:0, possession:0 };
    for(const o of [...c.terrain, ...c.banc]) c.fit[o.pid] = joueur(o.pid).forme;
    for(const o of c.terrain) c.aJoue.add(o.pid);
    c.perf = {};                                                     // points de performance par joueur, convertis en note sur 10
    for(const o of c.terrain) c.perf[o.pid] = 0;
    c.feuilleJiff = compterJiff(f); c.melees = {g:0, p:0}; c.touches = {g:0, p:0};
    return c;
  };
  return { dom:cote(domId,fD,tacD), ext:cote(extId,fE,tacE), minute:0, feed:[], termine:false, blessures:[], marqueurs:{},
           contexte: contexte || {type:"journee"}, sansNul: !!(contexte && contexte.type==="phase"),
           pos:50,                 // position du ballon : 0 = ligne d'en-but de l'équipe à domicile, 100 = celle des visiteurs
           possesseur:"dom",       // équipe qui a le ballon

/** Ajoute (ou retire) des points de performance à un joueur. */
function perf(cote, pid, points){ if(pid===undefined||pid===null) return; cote.perf[pid] = (cote.perf[pid]||0) + points; }
/** Récompense l'ensemble du XV présent (effort collectif). */
function perfCollectif(cote, points){ for(const o of cote.terrain) perf(cote, o.pid, points); }
function ajouterFeed(m, texte, type="action", pos){ m.feed.push({min:m.minute, texte, type, pos: pos===undefined ? (m.pos!==undefined ? Math.round(m.pos) : undefined) : pos}); }
/** Distance (en mètres) qui sépare le ballon de la ligne d'en-but adverse. */
function distanceEnBut(m, cote){ return cote===m.dom ? Math.max(0, 100 - m.pos) : Math.max(0, m.pos); }
/** Décrit la zone du terrain pour le fil du match, du point de vue de l'équipe qui attaque. */
function zoneTexte(m, att){
  const d = distanceEnBut(m, att);

  if(d <= 22) return "dans les 22 adverses";
  if(d <= 40) return "aux abords des 40 mètres adverses";

function nouvellePossession(m, cote, libelle){

/** Probabilité de réussite d'un tir au but selon la distance réelle et le buteur. */
function reussiteTir(p, distance){
  const base = 0.96 - Math.max(0, distance - 10) * 0.016;
  const botte = p.attr.pied * 0.026 + p.attr.vis * 0.006;              // le sang-froid compte autant que la technique
  return clamp(base * (0.55 + botte), 0.05, 0.96);
}
const nomJ = pid => joueur(pid).nom;

function notesEquipe(cote, domicile){
  const J = cote.terrain.map(o => ({p:joueur(o.pid), num:o.num, fit:cote.fit[o.pid]}));
  const bonus = (j,k) => (k==="puis" && cote.bonusPuis && cote.bonusPuis[j.p.id]) ? cote.bonusPuis[j.p.id]
                       : (k==="plac" && cote.bonusPlac && cote.bonusPlac[j.p.id]) ? cote.bonusPlac[j.p.id] : 0;
  const eff = (j,k) => (j.p.attr[k] + bonus(j,k)) * (0.8 + 0.2*Math.max(0,j.fit)/100) * (auPoste(j.p, POSTE_PAR_NUMERO[j.num-1]) ? 1 : 0.9);
  const avg = (arr, fn) => arr.length ? arr.reduce((s,j)=>s+fn(j),0)/arr.length : 8;
  const avants = J.filter(j=>j.num<=8), arrieres = J.filter(j=>j.num>8);
  const pack = avg(avants, j => eff(j,"puis")*0.6 + eff(j,"plac")*0.4);

/** Puissance de mêlée (première ligne surtout) et qualité de touche (lanceur + sauteurs). */
function forceMelee(cote){
  const eff = o => joueur(o.pid).attr.puis * (0.8 + 0.2*Math.max(0,cote.fit[o.pid])/100);
  const pl = cote.terrain.filter(o=>o.num<=3), sl = cote.terrain.filter(o=>o.num===4||o.num===5);
  const avg = arr => arr.length ? arr.reduce((s,o)=>s+eff(o),0)/arr.length : 8;
  return avg(pl)*0.7 + avg(sl)*0.3;
}
function forceTouche(cote){
  const tal = cote.terrain.find(o=>o.num===2); const saut = cote.terrain.filter(o=>[4,5,8].includes(o.num));
  const lanceur = tal ? joueur(tal.pid).attr.vis : 8;
  const sauteurs = saut.length ? saut.reduce((s,o)=>s+(joueur(o.pid).attr.puis+joueur(o.pid).attr.vis)/2,0)/saut.length : 8;
  let note = lanceur*0.4 + sauteurs*0.6;

  const cap = cote.spec && cote.spec.capitaineTouche && cote.terrain.find(o=>o.pid===cote.spec.capitaineTouche);
  if(cap){ const p = joueur(cap.pid); note += (p.attr.vis - 10) * 0.18 + clamp((p.age-23)*0.06, 0, 0.7); }
  const sc = cote.schemas || SCHEMAS_DEFAUT;

/**

function buteur(cote){
  const sur = pid => cote.terrain.find(o=>o.pid===pid);

    const b1 = cote.spec.buteur1 && sur(cote.spec.buteur1); if(b1) return b1;
    const b2 = cote.spec.buteur2 && sur(cote.spec.buteur2); if(b2) return b2;

  return cote.terrain.reduce((b,o) => (!b || joueur(o.pid).attr.pied > joueur(b.pid).attr.pied) ? o : b, null);
}

function remplacer(m, cote, sortant, motif){
  if(!cote.banc.length){ cote.terrain = cote.terrain.filter(o=>o!==sortant); return null; }
  const poste = joueur(sortant.pid).poste; const avant = AVANTS.includes(poste);
  const entrant = cote.banc.find(o=>auPoste(joueur(o.pid), poste)) || cote.banc.find(o => avant === AVANTS.includes(joueur(o.pid).poste)) || cote.banc[0];
  cote.banc = cote.banc.filter(o=>o!==entrant);
  sortant.pid = entrant.pid; cote.remplacements++; cote.aJoue.add(entrant.pid);
  entreeJoueur(m, cote, entrant.pid);
  ajouterFeed(m, `🔁 ${cote.nom} : ${nomJ(entrant.pid)} remplace ${motif}`, "info");
  return entrant;
}
/** Entrée d'un remplaçant : les finisseurs d'impact arrivent lancés en seconde période. */
function entreeJoueur(m, cote, pid){
  cote.entres = cote.entres || {}; cote.entres[pid] = m.minute;
  if(cote.bomb && cote.bomb.has(pid) && m.minute >= 40){
    cote.boost = cote.boost || new Set(); cote.boost.add(pid);
    const p = joueur(pid);
    cote.bonusPuis = cote.bonusPuis || {}; cote.bonusPuis[pid] = 2; cote.bonusPlac = cote.bonusPlac || {}; cote.bonusPlac[pid] = 1;
    ajouterFeed(m, `💥 Finisseur d'impact : ${p.nom} entre avec la consigne de faire mal au contact.`, "info");
  }
}
/** Meilleur remplaçant disponible pour un poste donné (spécialité respectée). */
function meilleurRemplacant(cote, poste){
  const avant = AVANTS.includes(poste);
  const exact = cote.banc.filter(o=>joueur(o.pid).poste===poste);
  const compat = cote.banc.filter(o=>auPoste(joueur(o.pid), poste));
  const groupe = cote.banc.filter(o=>avant === AVANTS.includes(joueur(o.pid).poste));
  const liste = exact.length ? exact : compat.length ? compat : groupe;
  return liste.sort((a,b)=>moyenne(joueur(b.pid))-moyenne(joueur(a.pid)))[0] || null;
}
/**
 * Coaching automatique : applique les règles paramétrées par le manager.
 * Respecte les postes, ne dépasse jamais le nombre de remplaçants disponibles.
 */
function coachingAuto(m, cote){
  const a = cote.auto || AUTO_DEFAUT; if(!a.actif || a.critere==="aucun" || !cote.banc.length) return;
  const min = m.minute;
  // Entrée groupée des finisseurs d'impact
  if(a.bombGroupee && cote.bomb && cote.bomb.size && min === (a.bombMinute||55)){
    const bombs = cote.banc.filter(o=>cote.bomb.has(o.pid)).slice(0,4);
    for(const b of bombs){
      const poste = joueur(b.pid).poste;
      const cible = cote.terrain.filter(o=>auPoste(joueur(o.pid), poste)).sort((x,y)=>cote.fit[x.pid]-cote.fit[y.pid])[0]
                 || cote.terrain.filter(o=>AVANTS.includes(poste)===(o.num<=8)).sort((x,y)=>cote.fit[x.pid]-cote.fit[y.pid])[0];
      if(!cible) continue;
      cote.banc = cote.banc.filter(o=>o!==b); const nomS = nomJ(cible.pid);
      cible.pid = b.pid; cote.remplacements++; cote.aJoue.add(b.pid); entreeJoueur(m, cote, b.pid);
      ajouterFeed(m, `🔁 ${cote.nom} : ${nomJ(b.pid)} remplace ${nomS} (entrée groupée des finisseurs).`, "info");
    }

  }

  if(a.critere==="forme40" || a.critere==="forme30"){
    const seuil = a.critere==="forme40" ? 40 : 30;
    const epuise = cote.terrain.filter(o=>cote.fit[o.pid] < seuil).sort((x,y)=>cote.fit[x.pid]-cote.fit[y.pid])[0];
    if(epuise){
      const ent = meilleurRemplacant(cote, joueur(epuise.pid).poste);
      if(ent){ cote.banc = cote.banc.filter(o=>o!==ent); const nomS = nomJ(epuise.pid);
        epuise.pid = ent.pid; cote.remplacements++; cote.aJoue.add(ent.pid); entreeJoueur(m, cote, ent.pid);
        ajouterFeed(m, `🔁 ${cote.nom} : ${nomJ(ent.pid)} remplace ${nomS} (consigne automatique, joueur sous ${seuil} %).`, "info"); }
    }
    return;
  }
  // Coaching programmé entre la 50e et la 60e
  if(a.critere==="coaching" && min>=50 && min<=60 && Math.random()<0.45){
    const fatigue = [...cote.terrain].sort((x,y)=>cote.fit[x.pid]-cote.fit[y.pid])[0];
    if(fatigue){
      const ent = meilleurRemplacant(cote, joueur(fatigue.pid).poste);
      if(ent){ cote.banc = cote.banc.filter(o=>o!==ent); const nomS = nomJ(fatigue.pid);
        fatigue.pid = ent.pid; cote.remplacements++; cote.aJoue.add(ent.pid); entreeJoueur(m, cote, ent.pid);
        ajouterFeed(m, `🔁 ${cote.nom} : ${nomJ(ent.pid)} remplace ${nomS} (coaching programmé).`, "info"); }
    }
  }
}
function remplacementTactique(m, cote){
  if(!cote.banc.length) return;
  const fat = cote.terrain.filter(o=>cote.fit[o.pid]<50).sort((a,b)=>cote.fit[a.pid]-cote.fit[b.pid]);
  if(!fat.length) return;

function commentaireAction(att, def, tac){

function marquerEssai(m, att, o, detail){

/** Phase de jeu déduite de la séquence courante, pour l'indicateur du mini-stade. */
function phaseEnCours(m){
  const t = (m.sequence || "").toLowerCase();
  if(t.includes("mêlée")) return "Mêlée";
  if(t.includes("touche")) return "Touche";
  if(t.includes("maul")) return "Maul";
  if(t.includes("renvoi")) return "Renvoi";
  if(t.includes("coup d'envoi")) return "Coup d'envoi";
  if(t.includes("contre 15")) return "Supériorité";
  if(t.includes("récupère") || t.includes("dégage")) return "Turnover";
  return "Jeu déployé";
}
/** Le manager doit-il être consulté ? (uniquement pour son équipe, en direct) */
function peutInterrompre(m, cote){

}
/** Ouvre un moment-clé : la simulation se met en pause jusqu'à la réponse du manager. */
function ouvrirDecision(m, decision){ m.decision = decision; pauseSimulation(); }
/** Applique le choix du manager puis relance le match. */
function resoudreDecision(choix){
  const m = matchCourant; if(!m || !m.decision) return;
  const d = m.decision; m.decision = null;
  const att = d.cote==="dom" ? m.dom : m.ext, def = att===m.dom ? m.ext : m.dom;
  if(d.type==="penalite"){
    const k = buteur(att); const dist = d.dist;
    if(choix==="perches" && k){
      const d2 = Math.round(dist + 12);
      if(Math.random() < reussiteTir(joueur(k.pid), d2)){ att.score += 3; att.pens++; perf(att, k.pid, 4); ajouterFeed(m, `🎯 ${nomJ(k.pid)} passe la pénalité à ${d2} m : +3 pour ${att.nom}.`, "pen"); m.pos = 50; nouvellePossession(m, def, "Renvoi"); }
      else { perf(att, k.pid, -3); ajouterFeed(m, `Pénalité manquée par ${nomJ(k.pid)} à ${d2} m.`, "info"); m.pos = att===m.dom ? 78 : 22; nouvellePossession(m, def, "Renvoi aux 22"); }
    } else if(choix==="touche"){
      avancer(m, att, Math.max(0, distanceEnBut(m, att) - 5));
      ajouterFeed(m, `Le capitaine choisit la pénaltouche : ${att.nom} tape à cinq mètres.`, "action");
      if(Math.random() < 0.26 + (notesEquipe(att, att===m.dom).att - notesEquipe(def, def===m.dom).def)*0.028){
        const avants = att.terrain.filter(o=>o.num<=8); marquerEssai(m, att, alea(avants.length?avants:att.terrain), "sur maul pénétrant");
      } else { const perdu = Math.random()<0.55; ajouterFeed(m, `Maul repoussé par ${def.nom}${perdu?", qui récupère le ballon":""}.`, "action"); if(perdu) nouvellePossession(m, def, `${def.nom} dégage`); }
    } else {
      ajouterFeed(m, `${att.nom} joue la pénalité à la main pour surprendre la défense.`, "action");
      avancer(m, att, 8 + Math.round(Math.random()*12)); m.tempsDeJeu = 0;
      if(Math.random()<0.18){ const grp = att.terrain.filter(o=>o.num>8); marquerEssai(m, att, alea(grp.length?grp:att.terrain), "sur une pénalité jouée vite"); }
      else if(Math.random()<0.3){ ajouterFeed(m, `La défense se replace, ${def.nom} récupère.`, "action"); nouvellePossession(m, def, `${def.nom} récupère`); }
