      ajouterFeed(m, `${nomJ(d.pid)} serre les dents et reste sur le terrain, diminué.`, "blessure");
      if(Math.random()<0.35){ m.blessures.push({pid:d.pid, semaines:2 + Math.floor(Math.random()*4)}); ajouterFeed(m, `Son genou ne tient pas : la blessure s'aggrave.`, "blessure"); remplacer(m, cote, o, `${nomJ(d.pid)}, aggravation`); }
    }
  } else if(d.type==="fin"){
    const cote = d.cote==="dom" ? m.dom : m.ext;
    if(choix==="fermer"){ cote.cons = {...(cote.cons||CONSIGNES_DEFAUT), rythme:"fermer", penalites:"pied"}; ajouterFeed(m, `${cote.nom} ferme le jeu pour tenir le score.`, "info"); }
    else if(choix==="tout"){ cote.cons = {...(cote.cons||CONSIGNES_DEFAUT), rythme:"accelere", penalites:"main"}; cote.tac = "large"; ajouterFeed(m, `${cote.nom} tente tout : jeu large et pénalités à la main.`, "info"); }
    else ajouterFeed(m, `${cote.nom} ne change rien à son plan de jeu.`, "info");
    if(choix!=="rien") state.consignes = {...(state.consignes||CONSIGNES_DEFAUT), ...cote.cons};
  }
  render();
}
/** Une minute de jeu. */
function jouerMinute(m){
  if(m.decision) return;                                                   // un moment-clé attend la décision du manager
  m.minute++; const min = m.minute; const cotes = [m.dom, m.ext];
  for(const c of cotes) c.prison = c.prison.filter(pr => { if(min>=pr.retour){ c.terrain.push({pid:pr.pid, num:pr.num}); ajouterFeed(m, `${nomJ(pr.pid)} revient sur le terrain.`, "info"); return false; } return true; });
  for(const c of cotes) for(const o of c.terrain){ const p = joueur(o.pid);
    const rythme = c.cons && c.cons.rythme==="accelere" ? 1.3 : c.cons && c.cons.rythme==="fermer" ? 0.85 : 1;
    const effort = c.cons && c.cons.defense==="montante" ? 1.15 : 1;
    const impact = (c.boost && c.boost.has(o.pid)) ? 1.3 : 1;                   // les finisseurs se vident plus vite
    c.fit[o.pid] = Math.max(0, c.fit[o.pid] - (0.35 + (20-p.attr.end)*0.05)*(o.num<=8?1.15:1)*rythme*effort*impact); }
  for(const c of cotes){
    if(c.id===state.clubId) coachingAuto(m, c);                                  // vos règles de coaching
    else if(min>=48 && min<=72 && Math.random()<0.35) remplacementTactique(m, c); // les clubs IA gèrent seuls
  }

  const nD = notesEquipe(m.dom, true), nE = notesEquipe(m.ext, false);
  // L'équipe qui a le ballon garde la main tant qu'elle n'a pas perdu la possession : la séquence continue.
  const att = m.possesseur==="dom" ? m.dom : m.ext, def = att===m.dom ? m.ext : m.dom;
  const nA = att===m.dom ? nD : nE, nDf = att===m.dom ? nE : nD;
  att.possession++; m.tempsDeJeu++;
  const w = TACTIQUES[att.tac].poids;
  const dist = distanceEnBut(m, att);                                     // mètres à parcourir jusqu'à l'en-but
  const zone = zoneTexte(m, att);
  const superiorite = clamp((nA.att - nDf.def)/5, -1, 1);
  const domination = clamp((nA.att - nDf.def)/4, 0, 1);
  const scRuckD = (def.schemas || SCHEMAS_DEFAUT).ruck;                    // schéma de la défense adverse
  const techniciens = att.terrain.filter(o=>joueur(o.pid).perso==="technicien").length;
  const insouciants = att.terrain.filter(o=>joueur(o.pid).perso==="insouciant").length;
  const guerriersDef = def.terrain.filter(o=>joueur(o.pid).perso==="guerrier").length;
  const cA = att.cons || CONSIGNES_DEFAUT, cD = def.cons || CONSIGNES_DEFAUT;     // consignes des deux camps
  const defMont = cD.defense==="montante", defRepli = cD.defense==="repli";
  const accel = cA.rythme==="accelere", fermer = cA.rythme==="fermer";
  const pBless = 0.004, pJaune = 0.006 * (1 + domination) * (dist<22 ? 1.6 : 1) * (defMont ? 1.5 : defRepli ? 0.75 : 1), pRouge = 0.0006 * (defMont ? 1.4 : 1);
  const pJauneFinal = pJaune * (1 + guerriersDef*0.06) * (scRuckD==="contre" ? 1.35 : 0.85);
  // Probabilité d'essai : très faible loin de la ligne, forte à proximité
  const proximite = dist<=5 ? 1 : dist<=22 ? 0.55 : dist<=40 ? 0.16 : 0.05;
  const pEssai = 0.215 * proximite * w.essai * clamp(1 + superiorite, 0.4, 2.2) * (accel ? 1.2 : fermer ? 0.7 : 1) * (defMont ? 1.18 : defRepli ? 0.72 : 1) * (scRuckD==="reconstituee" ? 0.9 : 1.12);
  const pFaute = 0.175 * (dist<40 ? 1.2 : 0.85) * (scRuckD==="contre" ? 1.28 : 0.93);                          // faute de la défense : pénalité pour l'attaque
  const factRuck = scRuckD==="contre" ? 1.35 : 0.92;
  const impactAtt = att.boost ? att.terrain.filter(o=>att.boost.has(o.pid)).length : 0;
  const pTurnover = (0.10 * clamp(1 - superiorite*0.5, 0.5, 1.6) * (1 - techniciens*0.02 - impactAtt*0.03 + insouciants*0.025) * factRuck + m.tempsDeJeu*0.012) * (defMont ? 1.55 : defRepli ? 0.75 : 1) * (accel ? 1.15 : fermer ? 0.85 : 1);
  const pMelee = 0.05, pTouche = 0.05, pDrop = (dist<=40 ? 0.02 : 0.002) * w.drop;
  let r = Math.random();

  if((r -= pBless) < 0){                                                   // BLESSURE
    const c = alea([m.dom, m.ext]);
    const fragiles = c.terrain.filter(x=>joueur(x.pid).perso==="fragile");
    const o = (fragiles.length && Math.random()<0.45) ? alea(fragiles) : alea(c.terrain);
    const p = joueur(o.pid); const sem = 1 + Math.floor(Math.random()*6);
    // Moment-clé : coup dur sur un de vos joueurs, on sort ou on serre les dents
    const autoActif = c.id===state.clubId && c.auto && c.auto.actif;
    if(!autoActif && peutInterrompre(m, c) && sem <= 3 && c.banc.length && Math.random() < 0.8){
      ouvrirDecision(m, {type:"blessure", cote: c===m.dom?"dom":"ext", pid:p.id,
        titre:`${p.nom} est touché`,
        texte:`${p.nom} (${POSTES[p.poste]}) reste au sol après un choc. Le staff médical le juge apte à continuer, mais diminué.`,
        options:[["sortir", "Le remplacer immédiatement"], ["rester", "Le laisser terminer, quitte à prendre un risque"]]});
      return;
    }
    m.blessures.push({pid:p.id, semaines:sem});
    ajouterFeed(m, `🚑 ${p.nom} (${c.nom}) doit sortir sur blessure (${sem} sem.).`, "blessure");
    remplacer(m, c, o, `${p.nom} blessé`);
  }
  else if((r -= pRouge) < 0){                                              // CARTON ROUGE
    const o = alea(def.terrain); def.terrain = def.terrain.filter(x=>x!==o); def.rouges++; perf(def, o.pid, -15);
    ajouterFeed(m, `🟥 Carton rouge pour ${nomJ(o.pid)} (${def.nom}) après un plaquage dangereux, ${zone} !`, "rouge");
  }
  else if((r -= pJauneFinal) < 0){                                         // CARTON JAUNE
    const guerriers = def.terrain.filter(o=>joueur(o.pid).perso==="guerrier");
    const av = def.terrain.filter(o=>o.num<=8);
    const o = (guerriers.length && Math.random()<0.4) ? alea(guerriers) : (Math.random()<0.7 && av.length) ? alea(av) : alea(def.terrain);
    def.terrain = def.terrain.filter(x=>x!==o); def.prison.push({pid:o.pid, num:o.num, retour:min+10});
    perf(def, o.pid, -7); ajouterFeed(m, `🟨 Carton jaune pour ${nomJ(o.pid)} (${def.nom}) : fautes répétées ${zone}, dix minutes.`, "jaune");
    m.sequence = `${att.nom} joue à ${def.terrain.length} contre 15`;
  }
  else if((r -= pEssai) < 0){                                              // ESSAI
    const grp = att.tac==="pres" ? att.terrain.filter(o=>o.num<=8) : att.terrain.filter(o=>o.num>8);
    const finisseur = alea(grp.length?grp:att.terrain);
    const detail = dist<=5 ? "sur un pick-and-go" : dist<=22 ? "après une belle séquence" : "au terme d'une action de 60 mètres";
    marquerEssai(m, att, finisseur, detail);
  }
  else if((r -= pFaute) < 0){                                              // FAUTE DE LA DÉFENSE
    const fautif = alea(def.terrain); const k = buteur(att);
    // Moment-clé : à portée de perches, dans un match serré ou en fin de rencontre, le manager tranche
    if(peutInterrompre(m, att) && dist <= 45 && k && (Math.abs(att.score-def.score) <= 7 || min >= 60) && Math.random() < 0.55){
      ouvrirDecision(m, {type:"penalite", cote: att===m.dom?"dom":"ext", dist, fautif:fautif.pid, buteur:k.pid,
        titre:`Pénalité à ${Math.round(dist+12)} m`,
        texte:`Faute de ${nomJ(fautif.pid)} ${zone}. ${att.nom} mène-t-il ${att.score}-${def.score} ? Le capitaine attend votre consigne.`,
        options:[["perches", `Aux perches (${nomJ(k.pid)}, ${Math.round(reussiteTir(joueur(k.pid), Math.round(dist+12))*100)} % de réussite)`],
                 ["touche", "Pénaltouche et maul à cinq mètres"],
                 ["rapide", "Jouer vite à la main"]]});
      return;
    }
    const tirable = dist <= 48 && k && joueur(k.pid).attr.pied >= 10;
    // Le buteur tente d'autant plus volontiers qu'il est proche, que le score est serré ou que la fin approche
    const envie = (dist<=25 ? 0.92 : dist<=35 ? 0.8 : 0.55)
      + (att.tac==="occupation" ? 0.2 : att.tac==="large" ? -0.2 : 0)
      + (Math.abs(att.score-def.score)<=6 ? 0.15 : 0) + (min>65 ? 0.15 : 0) - (dist<=6 ? 0.9 : 0);
    const choixPied = tirable && (cA.penalites==="pied" ? true : cA.penalites==="main" ? false : Math.random() < envie);
    if(choixPied){
      const d2 = Math.round(dist + 12);
      if(Math.random() < reussiteTir(joueur(k.pid), d2)){ att.score += 3; att.pens++; perf(att, k.pid, 4); perf(def, fautif.pid, -2); ajouterFeed(m, `🎯 Pénalité de ${nomJ(k.pid)} à ${d2} m après une faute de ${nomJ(fautif.pid)} : +3 pour ${att.nom}.`, "pen"); m.pos = 50; nouvellePossession(m, def, "Renvoi"); }
      else { perf(att, k.pid, -3); ajouterFeed(m, `Pénalité manquée par ${nomJ(k.pid)} à ${d2} m, le ballon passe à côté.`, "info"); m.pos = att===m.dom ? 78 : 22; nouvellePossession(m, def, "Renvoi aux 22"); }
    } else if(dist > 45 && att.tac!=="pres" && Math.random()<0.5){
      avancer(m, att, Math.min(dist - 12, 25 + Math.round(Math.random()*20)));
      ajouterFeed(m, `Faute de ${nomJ(fautif.pid)} : ${att.nom} trouve une longue pénaltouche et gagne du terrain.`, "action");
      m.tempsDeJeu = 0; m.sequence = `Touche pour ${att.nom} ${zoneTexte(m, att)}`;
    } else {
      avancer(m, att, Math.max(0, dist - 5));
      ajouterFeed(m, `Faute de ${nomJ(fautif.pid)} : ${att.nom} tape en touche à cinq mètres.`, "action");
      const pilonneur = att.spec && att.spec.pilonneur && att.terrain.find(o=>o.pid===att.spec.pilonneur);
      if(Math.random() < 0.26 + (nA.att - nDf.def)*0.028 + (pilonneur ? 0.06 : 0)){
        const avants = att.terrain.filter(o=>o.num<=8);
        marquerEssai(m, att, pilonneur || alea(avants.length?avants:att.terrain), "sur maul pénétrant");
      } else {
        const perdu = Math.random() < 0.55;
        ajouterFeed(m, `Maul repoussé par ${def.nom}, la défense tient${perdu?` et récupère le ballon`:``}.`, "action");
        for(const o of def.terrain) if(o.num<=8) perf(def, o.pid, 0.8);
        m.tempsDeJeu = 0; if(perdu) nouvellePossession(m, def, `${def.nom} dégage`);
      }
    }
  }
  else if((r -= pDrop) < 0){                                               // DROP
    const k = att.terrain.find(o=>o.num===10) || buteur(att);
    if(k){
      const d2 = Math.round(dist + 10);
      if(Math.random() < reussiteTir(joueur(k.pid), d2) * 0.8){ att.score += 3; att.drops++; perf(att, k.pid, 5); ajouterFeed(m, `🎯 DROP de ${nomJ(k.pid)} à ${d2} m ! +3 pour ${att.nom}.`, "drop"); m.pos = 50; nouvellePossession(m, def, "Renvoi"); }
      else { ajouterFeed(m, `Drop tenté par ${nomJ(k.pid)} à ${d2} m, à côté.`, "info"); m.pos = att===m.dom ? 78 : 22; nouvellePossession(m, def, "Renvoi aux 22"); }
    }
  }
  else if((r -= pMelee) < 0){                                              // MÊLÉE
    const scM = (att.schemas || SCHEMAS_DEFAUT).melee;
    const bonusM = scM==="enfoncement" ? 0.06 : scM==="ejection" ? -0.02 : 0.02;
    const gagne = Math.random() < clamp(0.5 + (forceMelee(att) - forceMelee(def))*0.06 + bonusM, 0.2, 0.9);
    if(gagne){ att.melees.g++; def.melees.p++; for(const o of att.terrain) if(o.num<=5) perf(att, o.pid, 1.2);
      if(scM==="enfoncement"){
        avancer(m, att, 3 + Math.round(Math.random()*3));
        if(Math.random() < 0.45 + (forceMelee(att)-forceMelee(def))*0.04){
          const k = buteur(att); const d2 = Math.round(distanceEnBut(m, att) + 12);
          if(k && d2 <= 50 && (att.cons||CONSIGNES_DEFAUT).penalites!=="main" && Math.random() < reussiteTir(joueur(k.pid), d2)){
            att.score += 3; att.pens++; perf(att, k.pid, 4);
            ajouterFeed(m, `🎯 Mêlée d'enfoncement : ${def.nom} s'écroule, ${nomJ(k.pid)} punit à ${d2} m.`, "pen"); m.pos = 50; nouvellePossession(m, def, "Renvoi");
          } else ajouterFeed(m, `Mêlée d'enfoncement : pénalité obtenue ${zone}, ${att.nom} joue à la main.`, "action");
        } else ajouterFeed(m, `La mêlée de ${att.nom} avance ${zone} sans obtenir la pénalité.`, "action");
        m.tempsDeJeu = 0;
      } else if(scM==="ejection"){
        avancer(m, att, 7 + Math.round(Math.random()*8));
        const ouv = att.terrain.find(o=>o.num===10) || att.terrain[0];
        ajouterFeed(m, `Éjection rapide 8-9-10 : ${nomJ(ouv.pid)} lance les lignes arrière ${zone}.`, "action");
        if(Math.random() < 0.12){ ajouterFeed(m, `Transmission trop rapide, ballon au sol.`, "action"); nouvellePossession(m, def, `${def.nom} récupère`); } else m.tempsDeJeu = 0;
      } else {
        const n8 = att.terrain.find(o=>o.num===8) || att.terrain[0];
        avancer(m, att, 5 + Math.round(Math.random()*5)); perf(att, n8.pid, 1);
        ajouterFeed(m, `Départ au ras du 8 : ${nomJ(n8.pid)} sort le ballon et avance ${zone}.`, "action"); m.tempsDeJeu = 0;
      }
    } else { def.melees.g++; att.melees.p++; for(const o of def.terrain) if(o.num<=5) perf(def, o.pid, 1.2); for(const o of att.terrain) if(o.num<=3) perf(att, o.pid, -1.2);
      ajouterFeed(m, `Mêlée perdue par ${att.nom} ${zone} : ${def.nom} récupère.`, "action");
      nouvellePossession(m, def, `Mêlée gagnée par ${def.nom}`);
    }
  }
  else if((r -= pTouche) < 0){                                             // TOUCHE
    const gagne = Math.random() < clamp(0.58 + (forceTouche(att) - forceTouche(def))*0.05, 0.3, 0.92);
    if(gagne){ att.touches.g++; const tal = att.terrain.find(o=>o.num===2); if(tal) perf(att, tal.pid, 1);
      const cap = att.spec && att.spec.capitaineTouche && att.terrain.find(o=>o.pid===att.spec.capitaineTouche); if(cap) perf(att, cap.pid, 1);
      const scT = (att.schemas || SCHEMAS_DEFAUT).touche;
      const pilon = att.spec && att.spec.pilonneur && att.terrain.find(o=>o.pid===att.spec.pilonneur);
      const sauteurs = att.terrain.filter(o=>[4,5,8].includes(o.num));
      if(scT==="maul"){
        const chanceMaul = (dist<=22 ? 0.2 : 0.07) + (pilon ? 0.05 : 0);
        avancer(m, att, 4 + Math.round(Math.random()*6));
        if(Math.random() < chanceMaul){ const av = att.terrain.filter(o=>o.num<=8); marquerEssai(m, att, pilon || alea(av.length?av:att.terrain), "sur ballon porté"); }
        else ajouterFeed(m, `Maul pénétrant de ${att.nom} ${zone}, la défense finit par le stopper.`, "action");
      } else if(scT==="fond"){
        avancer(m, att, 8 + Math.round(Math.random()*10));
        const arr = att.terrain.filter(o=>o.num>8);
        ajouterFeed(m, `Ballon rapide en fond d'alignement, ${nomJ(alea(arr.length?arr:att.terrain).pid)} lance le jeu ${zone}.`, "action");
      } else {
        avancer(m, att, 2 + Math.round(Math.random()*3));
        ajouterFeed(m, `Lancer court sécurisé pour ${att.nom}, ${nomJ((sauteurs.length?alea(sauteurs):att.terrain[0]).pid)} assure la conquête.`, "action");
      }
      m.tempsDeJeu = 0;
    } else { att.touches.p++; const tal = att.terrain.find(o=>o.num===2); if(tal) perf(att, tal.pid, -2.5); for(const o of def.terrain) if([4,5].includes(o.num)) perf(def, o.pid, 2); ajouterFeed(m, `Touche volée ! ${def.nom} chipe le lancer de ${att.nom} ${zone}.`, "action"); nouvellePossession(m, def, `Touche volée par ${def.nom}`); }
  }
  else if((r -= pTurnover) < 0){                                           // PERTE DE BALLON
    const d2 = alea(def.terrain); const a2 = alea(att.terrain);
    const motifs = [`Ballon gratté par ${nomJ(d2.pid)} sur ${nomJ(a2.pid)}`, `En-avant de ${nomJ(a2.pid)}`, `Passe interceptée par ${nomJ(d2.pid)}`, `Coup de pied mal assuré de ${nomJ(a2.pid)}, ${def.nom} contre-attaque`];
    perf(def, d2.pid, 3); perf(att, a2.pid, -2.5);
    ajouterFeed(m, `${alea(motifs)} ${zone}.`, "action");
    nouvellePossession(m, def, `${def.nom} récupère`);
    if(Math.random()<0.25) avancer(m, def, 10 + Math.round(Math.random()*15));
  }
  else {                                                                   // TEMPS DE JEU ORDINAIRE : gain ou perte de terrain
    const gain = Math.round(((att.tac==="occupation" ? 6 : att.tac==="large" ? 5 : 3) + superiorite*6 + (Math.random()*10 - 4)) * (accel ? 1.2 : fermer ? 0.8 : 1) * (defMont ? 0.85 : defRepli ? 1.15 : 1));
    avancer(m, att, gain);
    if(gain > 8){ const porteurs = att.terrain.filter(o=>att.boost && att.boost.has(o.pid));
      const porteur = (porteurs.length && Math.random()<0.4) ? alea(porteurs) : alea(att.terrain); perf(att, porteur.pid, 1); }
    else if(gain < 0){ const plaqueur = alea(def.terrain); perf(def, plaqueur.pid, 1); }
    if(att.tac==="occupation" && Math.random()<0.45){
      const b = att.terrain.find(o=>[9,10,15].includes(o.num)) || att.terrain[0];
      avancer(m, att, 12 + Math.round(Math.random()*15));
      ajouterFeed(m, `${nomJ(b.pid)} trouve une longue touche : ${att.nom} progresse ${zoneTexte(m, att)}.`, "action");
      if(Math.random()<0.5) nouvellePossession(m, def, `Touche pour ${def.nom}`);
    } else if(Math.random() < 0.55){
      ajouterFeed(m, commentaireAction(att, def, att.tac) + ` (${zoneTexte(m, att)})`, "action");
    }
    m.sequence = `${att.nom} — ${m.tempsDeJeu} temps de jeu, ${zoneTexte(m, att)}`;
  }

  // Moment-clé : dernier quart d'heure, match serré
  const moiCote = [m.dom, m.ext].find(c=>c.id===state.clubId);
  if(moiCote && min===66 && !m.decisionFin && peutInterrompre(m, moiCote)){
    const advCote = moiCote===m.dom ? m.ext : m.dom; const ecart = moiCote.score - advCote.score;
    if(Math.abs(ecart) <= 8){
      m.decisionFin = true;
      ouvrirDecision(m, {type:"fin", cote: moiCote===m.dom?"dom":"ext",
        titre:"Dernier quart d'heure",
        texte:`${ecart>0?`Vous menez de ${ecart} point(s)`:ecart===0?"Les deux équipes sont à égalité":`Vous êtes mené de ${-ecart} point(s)`} à la 66e. Quelle attitude pour le money time ?`,
        options:[["fermer", "Fermer le jeu et prendre les points au pied"], ["tout", "Tout tenter : jeu large et pénalités à la main"], ["rien", "Ne rien changer"]]});
      return;
    }
  }
  if(min===40){ ajouterFeed(m, `Mi-temps : ${m.dom.nom} ${m.dom.score} - ${m.ext.score} ${m.ext.nom}.`, "info"); m.pos = 50; nouvellePossession(m, m.ext, "Coup d'envoi de la seconde période"); }
  if(min===80 && m.sansNul && m.dom.score===m.ext.score) ajouterFeed(m, `Égalité à la 80e : prolongation, le premier point marqué décide !`, "info");
  if(min>=80){
    if(m.sansNul && m.dom.score===m.ext.score && min<120) return;         // mort subite en phase finale
    if(m.sansNul && m.dom.score===m.ext.score){ (m.dom.essais>=m.ext.essais ? m.dom : m.ext).score += 3; ajouterFeed(m, `Pénalité décisive à la 120e.`, "pen"); }
    m.termine = true; ajouterFeed(m, `Coup de sifflet final : ${m.dom.nom} ${m.dom.score} - ${m.ext.score} ${m.ext.nom}.`, "info");
    calculerNotes(m);
    m.homme = hommeDuMatch(m); if(m.homme) ajouterFeed(m, `⭐ Homme du match : ${nomJ(m.homme)} (${m.notes[m.homme].toFixed(1)}/10).`, "info");
  }
}
/**
 * Note sur 10 d'un joueur : base 6, ajustée par ses points de performance,
 * le résultat de son équipe et son temps passé sur le terrain.
 */
function calculerNotes(m){
  m.notes = {};
  for(const [c, adv] of [[m.dom, m.ext],[m.ext, m.dom]]){
    const ecart = c.score - adv.score;
    const bonusEquipe = clamp(ecart/20, -0.8, 0.8);
    for(const pid of c.aJoue){
      const pts = c.perf[pid] || 0;
      const perso = joueur(pid).perso;
      const variance = perso==="insouciant" ? (Math.random()*2.4 - 1.2) : perso==="regulier" ? (Math.random()*0.4 - 0.2) : (Math.random()*0.9 - 0.45);
      let n = 5.7 + (pts >= 0 ? Math.pow(pts, 0.72) * 0.26 : pts * 0.26) + bonusEquipe + variance;
      if(c.fit[pid] !== undefined && c.fit[pid] < 25) n -= 0.3;                  // a fini à bout de souffle
      m.notes[pid] = Math.round(clamp(n, 3, 9.8) * 10) / 10;
    }
  }
  return m.notes;
}
/** Homme du match : essais, puis buteur le plus prolifique, puis meilleur joueur de l'équipe gagnante. */
function hommeDuMatch(m){
  const notes = m.notes || {};
  const ids = Object.keys(notes).map(Number);
  if(!ids.length) return null;
  return ids.sort((a,b) => notes[b]-notes[a] || (m.marqueurs[b]||0)-(m.marqueurs[a]||0))[0];
}
/** Remplacement décidé par le manager (match en pause ou à la mi-temps). */
function remplacementManuel(m, num, pidEntrant){
  const cote = [m.dom, m.ext].find(c=>c.id===state.clubId); if(!cote) return;
  const sortant = cote.terrain.find(o=>o.num===num); const entrant = cote.banc.find(o=>o.pid===pidEntrant);
  if(!sortant || !entrant) return;
  cote.banc = cote.banc.filter(o=>o!==entrant); const nomS = nomJ(sortant.pid);
  sortant.pid = entrant.pid; cote.remplacements++; cote.aJoue.add(entrant.pid); entreeJoueur(m, cote, entrant.pid);
  ajouterFeed(m, `🔁 ${cote.nom} : ${nomJ(entrant.pid)} remplace ${nomS} (choix du manager).`, "info");
}
function simulerInstantane(m){ m.sansDecisions = true; while(!m.termine) jouerMinute(m); return m; }
function feuilleAuto(id){ return compositionAuto(id); }
function feuilleDuJoueur(){ return verifierFeuille(state.feuille, state.clubId).length ? compositionAuto(state.clubId) : state.feuille; }

/** Crée un match prêt à jouer (feuille/tactique du joueur si concerné, IA sinon). */
function preparerMatch(domId, extId, contexte){
  const fD = domId===state.clubId ? feuilleDuJoueur() : feuilleAuto(domId);
  const fE = extId===state.clubId ? feuilleDuJoueur() : feuilleAuto(extId);
  const tD = domId===state.clubId ? state.feuille.tactique : tactiqueIA(fD);
  const tE = extId===state.clubId ? state.feuille.tactique : tactiqueIA(fE);
  const m = creerMatch(domId, extId, fD, fE, tD, tE, contexte);
  nouvellePossession(m, m.dom, "Coup d'envoi");
  ajouterFeed(m, `Coup d'envoi au ${state.equipes[domId].stade} : ${m.dom.nom} (${TACTIQUES[tD].nom}) reçoit ${m.ext.nom} (${TACTIQUES[tE].nom}).`, "info");
  return m;
}

/* =====================================================================
   5. CHAMPIONNAT : journées, résultats, phase finale, saison
   ===================================================================== */
/** Applique statistiques, forme et blessures (commun championnat / phase finale). */
/** Archive un rapport de match consultable depuis le calendrier. */
function archiverRapport(m){
  state.rapports = state.rapports || {};
  const cle = `${state.saison}-${m.contexte.type}-${m.dom.id}-${m.ext.id}-${state.journee}`;
  const marqueurs = Object.entries(m.marqueurs).map(([pid,n]) => ({nom: nomJ(+pid), n, cote: m.dom.aJoue.has(+pid) ? m.dom.id : m.ext.id}));
  state.rapports[cle] = { saison:state.saison, journee: m.contexte.type==="journee" ? state.journee+1 : null, type:m.contexte.type,
    dom:m.dom.id, ext:m.ext.id, sd:m.dom.score, se:m.ext.score, ed:m.dom.essais, ee:m.ext.essais, pd:m.dom.pens, pe:m.ext.pens,
    md:m.dom.melees, me:m.ext.melees, td:m.dom.touches, te:m.ext.touches, posd: Math.round(m.dom.possession/Math.max(1,m.dom.possession+m.ext.possession)*100),
    tacD:m.dom.tac, tacE:m.ext.tac, marqueurs, homme: m.homme ? nomJ(m.homme) : null, homme_note: m.homme && m.notes ? m.notes[m.homme] : null,
    notes: m.notes ? [m.dom, m.ext].map(c => [...c.aJoue].map(pid => ({nom:nomJ(pid), note:m.notes[pid], club:c.id})).sort((a,b)=>b.note-a.note).slice(0,8)) : [],
    temps: m.feed.filter(e=>["essai","pen","drop","jaune","rouge","blessure"].includes(e.type)).slice(0,25) };
  const cles = Object.keys(state.rapports); if(cles.length>40) for(const k of cles.slice(0, cles.length-40)) delete state.rapports[k];
  m.rapportCle = cle; return cle;
}
function appliquerEffetsJoueurs(m){
  archiverRapport(m);
  if(!m.notes) calculerNotes(m);
  for(const c of [m.dom, m.ext]) for(const pid of c.aJoue){ const p = joueur(pid); p.stats.matchs++; p.forme = Math.max(10, Math.round(c.fit[pid]));
    p.records = p.records || {meilleureNote:0, essaisSaison:0, matchsTotal:0}; p.records.matchsTotal++;
    const n = m.notes[pid]; if(n!==undefined){ p.stats.sommeNotes = (p.stats.sommeNotes||0) + n; p.derniereNote = n;
      if(n > (p.records.meilleureNote||0)) p.records.meilleureNote = n;
      p.moral = clamp((p.moral===undefined?70:p.moral) + (n>=7.5?4:n>=6?1:-3), 0, 100); } }
  for(const [pid,n] of Object.entries(m.marqueurs)){ const p = joueur(+pid); p.stats.essais += n; p.stats.points += n*5;
    p.records = p.records || {meilleureNote:0, essaisSaison:0, matchsTotal:0}; if(p.stats.essais > (p.records.essaisSaison||0)) p.records.essaisSaison = p.stats.essais; }
  for(const b of m.blessures) joueur(b.pid).blessure = Math.max(joueur(b.pid).blessure, b.semaines);
}
function appliquerResultatChampionnat(m){
  const j = state.calendrier[state.journee];
  for(const c of [m.dom, m.ext]) if(c.id===state.clubId && c.feuilleJiff!==undefined){ state.jiffHist = state.jiffHist || []; state.jiffHist.push(c.feuilleJiff); }
  const entree = j.matchs.find(x => x.dom===m.dom.id && x.ext===m.ext.id);
  appliquerEffetsJoueurs(m);
  if(entree) entree.resultat = {sd:m.dom.score, se:m.ext.score, ed:m.dom.essais, ee:m.ext.essais, rapport:m.rapportCle};
  for(const [c,adv] of [[m.dom,m.ext],[m.ext,m.dom]]){
    const cl = state.classement[c.id]; const pc = pointsClassement(c.score, adv.score, c.essais, adv.essais);

/**
 * Progression et déclin : les jeunes progressent avec le temps de jeu (jusqu'à leur potentiel),
 * les trentenaires perdent vitesse et endurance. Appelé toutes les 6 journées (petits ajustements) et en fin de saison.
 */
function evolutionJoueurs(finSaison){
  const cles = ATTRIBUTS.map(a=>a[0]); const news = [];
  for(const e of Object.values(state.equipes)){ if(e.horsChampionnat) continue;
    for(const p of e.joueurs){
      const tj = p.stats.matchs; const r = Math.random();
      const bouge = (k, d) => { const av = p.attr[k]; p.attr[k] = clamp(p.attr[k]+d, 1, 20); if(p.attr[k]!==av && e.id===state.clubId) news.push(`${p.nom} ${d>0?"+":""}${d} ${ATTRIBUTS.find(a=>a[0]===k)[1].toLowerCase()}`); };
      const peutProgresser = () => moyenne(p) < (p.potentiel || moyenne(p));
      if(finSaison){
        if(p.age<=23){ const n = tj>=12 ? 2 : tj>=5 ? 1 : (r<0.4 ? 1 : 0); for(let i=0;i<n;i++) if(peutProgresser()) bouge(alea(cles), 1); }
        else if(p.age<=27){ if(tj>=14 && r<0.4 && peutProgresser()) bouge(alea(cles), 1); }
        else if(p.age<=30){ if(r<0.35) bouge(alea(["vit","end"]), -1); }
        else if(p.age<=32){ bouge(alea(["vit","end"]), -1); if(r<0.4) bouge(alea(["puis","plac"]), -1); }
        else { bouge(alea(["vit","end"]), -1); bouge(alea(["puis","plac","vis"]), -1); if(r<0.5) bouge("vit", -1); }
      } else {
        if(p.age<=23 && tj>=3 && r<0.35 && peutProgresser()) bouge(alea(cles), 1);
        else if(p.age<=26 && tj>=5 && r<0.12 && peutProgresser()) bouge(alea(cles), 1);
        if(p.age>=33 && r<0.2) bouge(alea(["vit","end"]), -1);
      }
    }
  }
  if(news.length) actualite((finSaison ? "Évolution de l'effectif — " : "Évolution — ") + news.slice(0,8).join(", ") + (news.length>8 ? ` et ${news.length-8} autre(s)` : "") + ".", "info");
}
/**
 * Semaine d'entraînement : appliquée entre deux journées.
 * L'axe oriente les attributs travaillés, l'intensité arbitre entre progression, fraîcheur et risque de blessure.
 */
function entrainementSemaine(impose){
  const c = club(); const sem = impose || state.semaine || SEMAINE_DEFAUT;           // impose : cycle automatique de préparation
  const axe = ENTRAINEMENTS[sem.axe] || ENTRAINEMENTS.defense; const inte = INTENSITES[sem.intensite] || INTENSITES.normale;
  const progres = [], bobos = [];
  for(const p of c.joueurs){
    // Fraîcheur : la récupération et l'intensité jouent sur la forme
    const bonusForme = (sem.axe==="recuperation" ? 14 : 0) + inte.forme + (p.perso==="bosseur" ? 4 : 0);
    p.forme = clamp(Math.round(p.forme + bonusForme), 5, 100);
    // Progression : seulement pour les joueurs concernés par l'axe, et jamais au-dessus du potentiel
    if(axe.attrs.length && p.blessure===0 && moyenne(p) < (p.potentiel||0)){
      const concerne = axe.cible==="tous" || (axe.cible==="avants" ? AVANTS.includes(p.poste) : !AVANTS.includes(p.poste));
      if(concerne){
        const base = p.age<=23 ? 0.16 : p.age<=27 ? 0.09 : 0.04;
        const chance = base * inte.progres * (p.perso==="bosseur" ? 1.6 : p.perso==="insouciant" ? 0.7 : 1);
        if(Math.random() < chance){ const k = alea(axe.attrs); const av = p.attr[k];
          p.attr[k] = clamp(p.attr[k]+1, 1, 20);
          if(p.attr[k] !== av) progres.push(`${p.nom} +1 ${ATTRIBUTS.find(a=>a[0]===k)[1].toLowerCase()}`); }
      }
    }
    // Blessures à l'entraînement
    if(p.blessure===0 && sem.axe!=="recuperation"){
      const risque = 0.006 * inte.blessure * (p.perso==="fragile" ? 2.2 : 1) * (p.forme<45 ? 1.8 : 1);
      if(Math.random() < risque){ p.blessure = 1 + Math.floor(Math.random()*3); bobos.push(`${p.nom} (${p.blessure} sem.)`); }
    }
  }
  if(progres.length) actualite(`Entraînement « ${axe.nom} » : ${progres.slice(0,6).join(", ")}${progres.length>6?` et ${progres.length-6} autre(s)`:""}.`, "ok");
  if(bobos.length) actualite(`Blessés à l'entraînement : ${bobos.join(", ")}.`, "erreur");
}
function recuperation(){
  for(const e of Object.values(state.equipes)) for(const p of e.joueurs){ p.forme = Math.min(100, p.forme + 25); p.blessure = Math.max(0, p.blessure-1); }
}
/** Joue tous les matchs restants de la journée courante puis passe à la suivante. */
function clorePeriodeJournee(){

    actualite(`J${j.numero} : ${pp>pc?"victoire":pp===pc?"match nul":"défaite"} ${pp}-${pc} contre ${state.equipes[dom?mien.ext:mien.dom].court}.`, pp>pc?"ok":"info"); }

  state.journee++; matchCourant = null; state.journeeVue = Math.min(state.journee+1, NB_JOURNEES);

}

function lancerMatchJoueur(){

/* ---- Phase finale LNR ------------------------------------------------- */
function creerPhaseFinale(){

    barrages:[{dom:cl[2], ext:cl[5], resultat:null, libelle:"Barrage 1 (3e - 6e)"}, {dom:cl[3], ext:cl[4], resultat:null, libelle:"Barrage 2 (4e - 5e)"}],

const vainqueur = mt => mt.resultat.sd > mt.resultat.se ? mt.dom : mt.ext;
function matchsEtapeCourante(){
  const ph = state.phase;
  if(ph.etape==="barrages") return [...ph.barrages, ph.maintien];

}
/** Joue l'étape en cours : match du joueur en direct s'il est concerné, les autres instantanément. */
function jouerEtape(){

  const mien = matchs.find(mt => mt.dom===state.clubId || mt.ext===state.clubId);

/**
 * Objectif fixé par le président en début de saison : une place à atteindre,
 * assortie d'un seuil en dessous duquel le poste est menacé.
 */
function definirObjectif(){
  const c = club(); const attendu = rangAttendu(c.id); const m = state.manager;
  // Un manager réputé se voit confier des ambitions plus élevées
  const ajust = m.reputation >= 80 ? -2 : m.reputation >= 65 ? -1 : m.reputation <= 35 ? 1 : 0;
  const cible = clamp(attendu + ajust, 1, 13);
  const tolerance = cible <= 2 ? 4 : cible <= 6 ? 4 : 3;
  const libelle = cible === 1 ? "remporter le Bouclier de Brennus"
    : cible <= 2 ? "atteindre la finale"
    : cible <= 6 ? `terminer dans les ${cible} premiers et disputer la phase finale`
    : cible <= 10 ? `terminer au moins ${cible}e`
    : "assurer le maintien sans trembler";
  state.president = {cible, limite: clamp(cible + tolerance, 5, 14), libelle, confiance: 62 + Math.round((m.reputation-55)*0.25), historique:[]};
  actualite(`Le président fixe l'objectif de la saison : ${libelle}. Confiance initiale ${state.president.confiance}/100.`, "info");
}
/** Met à jour la confiance du président après chaque journée. */
function majConfiance(){
  const p = state.president; if(!p || state.licencie) return;
  const c = club(); const cl = classementTrie(); const rang = cl.findIndex(l=>l.id===c.id)+1;
  const j = state.calendrier[state.journee-1]; if(!j) return;
  const mt = j.matchs.find(x=>x.dom===state.clubId||x.ext===state.clubId); if(!mt || !mt.resultat) return;
  const dom = mt.dom===state.clubId; const pp = dom?mt.resultat.sd:mt.resultat.se, pc = dom?mt.resultat.se:mt.resultat.sd;
  const adv = state.equipes[dom?mt.ext:mt.dom]; const rangAdv = cl.findIndex(l=>l.id===adv.id)+1;
  let d = 0;
  if(pp > pc) d += rangAdv < rang ? 6 : 4; else if(pp === pc) d += 0.5; else d -= (rangAdv > rang ? 6 : 3);
  if(!dom && pp > pc) d += 1.5;                                        // gagner dehors marque des points
  d += clamp((p.cible - rang) * 0.9, -5, 5);                           // position par rapport à l'objectif
  const moralMoyen = c.joueurs.reduce((s,x)=>s+(x.moral===undefined?70:x.moral),0) / Math.max(1,c.joueurs.length);
  d += (moralMoyen - 70) * 0.03;                                       // ambiance dans le vestiaire
  if(masseSalariale(c) > SALARY_CAP) d -= 2;                           // gestion financière
  p.confiance = clamp(Math.round(p.confiance + d), 0, 100);
  p.historique.push(p.confiance); if(p.historique.length > 26) p.historique.shift();
  // Avertissements et licenciement
  const journeesRestantes = NB_JOURNEES - state.journee;
  if(p.confiance <= 12 && state.journee >= 6 && journeesRestantes >= 2){ licenciement(rang); return; }
  if(p.confiance <= 25 && !p.avertiRouge){ p.avertiRouge = true; actualite(`Le président convoque le manager : « Le compte n'y est pas. Sans réaction rapide, nous prendrons nos responsabilités. »`, "erreur"); }
  else if(p.confiance <= 42 && !p.avertiOrange){ p.avertiOrange = true; actualite(`Le président rappelle l'objectif de la saison : ${p.libelle}. Il attend un redressement.`, "erreur"); }
  else if(p.confiance >= 85 && !p.felicite){ p.felicite = true; actualite(`Le président affiche publiquement sa confiance : « Nous avons le bon manager. »`, "ok"); }
}
/** Le manager est remercié : la carrière continue, sans club, depuis le menu. */
function licenciement(rang){
  const c = club(); const m = state.manager;
  state.licencie = true; m.reputation = clamp(m.reputation - 12, 5, 100);
  m.carriere.push({saison:state.saison, club:c.id, rang, titre:false, finaliste:false, reputation:m.reputation, licencie:true});
  actualite(`Vous êtes démis de vos fonctions par ${c.nom} après ${state.journee} journées (${rang}e, objectif : ${state.president.libelle}).`, "erreur");
  // Des clubs moins huppés peuvent tenter le pari
  const cl = classementTrie();
  const dispo = Object.values(state.equipes).filter(e=>!e.horsChampionnat && e.id!==c.id)
    .sort((a,b)=>a.reputation-b.reputation);
  // Un manager fraîchement remercié intéresse surtout les clubs en difficulté
  const eligibles = dispo.filter(e => m.reputation >= clamp(e.reputation - 34, 5, 88));
  const retenus = (eligibles.length ? eligibles : dispo).filter(e => (cl.findIndex(l=>l.id===e.id)+1) >= 8).slice(0,2);
  m.offres = (retenus.length ? retenus : dispo.slice(0,1))

/** Niveau attendu du club : un promu qui finit 8e a surperformé. */
function rangAttendu(clubId){
  const ordre = Object.values(state.equipes).filter(e=>!e.horsChampionnat).sort((a,b)=>b.reputation-a.reputation).map(e=>e.id);
  return ordre.indexOf(clubId) + 1;

/** Bilan de fin de saison : réputation du manager, palmarès, offres des autres clubs. */
function bilanCarriere(){

  const cl = classementTrie(); const rang = cl.findIndex(l=>l.id===c.id) + 1;
  const attendu = rangAttendu(c.id);

    .filter(e => m.reputation >= clamp(e.reputation - 12, 20, 92))
    .sort((a,b)=>b.reputation-a.reputation);

  if(rang===14 && !titre && m.reputation < 45) actualite(`La relégation fragilise votre poste : le président attend une remontée immédiate.`, "erreur");
